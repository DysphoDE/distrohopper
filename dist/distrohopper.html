<style>
/* =====================================================================
   DistroHopper – Stylesheet
   Look: gerice-ter Tiling-WM-Desktop (Blur, Gaps, Verlaufsrahmen)
   ===================================================================== */
:root {
  color-scheme: dark;
  --bg: #07090d;
  --win: rgba(12, 16, 23, 0.86);
  --win-solid: #0d1118;
  --win-hi: rgba(255, 255, 255, 0.035);
  --inset: rgba(0, 0, 0, 0.28);
  --line: rgba(255, 255, 255, 0.07);
  --line-2: rgba(255, 255, 255, 0.13);
  --fg: #e6edf3;
  --fg-2: #a9b6c2;
  --fg-3: #6f7d8b;
  --accent: #e95420;
  --accent-2: #ff9a6b;
  --accent-ink: #1a0b05;
  --accent-soft: rgba(233, 84, 32, 0.16);
  --wall1: #e95420;
  --wall2: #77216f;
  --good: #5ee08f;
  --warn: #ffcb57;
  --bad: #ff6272;
  --byte: #ffd166;
  --karma: #c9a2ff;
  --beard: #e3ad72;
  --gold: #ffd23f;
  --r: 12px;
  --r-sm: 8px;
  --gap: 10px;
  --f-ui: "JetBrains Mono", ui-monospace, "Cascadia Code", "DejaVu Sans Mono", Menlo, Consolas, monospace;
  --f-px: "Pixelify Sans", "JetBrains Mono", ui-monospace, monospace;
  --f-crt: "VT323", "JetBrains Mono", ui-monospace, monospace;
  /* Terminal-Farbschema */
  --t-bg: #0b0f0c;
  --t-fg: #d9f2d6;
  --t-dim: #6b8a70;
  --t-prompt: #ff9a6b;
  --t-ok: #7ee787;
  --t-err: #ff7b72;
  --t-warn: #e3b341;
  --t-str: #a5d6ff;
  --t-glow: rgba(126, 231, 135, 0.25);
}

html {
  box-sizing: border-box;
  height: 100%;
  background: var(--bg);
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  -webkit-text-size-adjust: 100%;
}
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--fg);
  font: 13px/1.45 var(--f-ui);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
  touch-action: manipulation;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
::selection { background: var(--accent); color: var(--accent-ink); }

/* Scrollbalken */
* { scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, 0.16) transparent; }
*::-webkit-scrollbar { width: 8px; height: 8px; }
*::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.14); border-radius: 8px; }
*::-webkit-scrollbar-track { background: transparent; }

.px { image-rendering: pixelated; image-rendering: crisp-edges; }
img.px, .upg img, .bld img, .ach img, .toast img, .chip img, .tab img, .buff img { image-rendering: pixelated; }

/* ============================================================ Wallpaper */
#wall {
  position: fixed; inset: 0; z-index: 0; overflow: hidden;
  background:
    radial-gradient(1200px 700px at 12% -10%, color-mix(in srgb, var(--wall1) 26%, transparent), transparent 60%),
    radial-gradient(900px 700px at 105% 110%, color-mix(in srgb, var(--wall2) 40%, transparent), transparent 60%),
    linear-gradient(160deg, #080b10 0%, #06080c 100%);
  transition: background 0.8s;
}
#wall::before {
  content: ""; position: absolute; inset: 0;
  background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1.2px);
  background-size: 22px 22px;
  mask-image: linear-gradient(180deg, rgba(0,0,0,.9), rgba(0,0,0,.35));
}
#wall-logo {
  position: absolute; right: -4vmin; bottom: -6vmin; width: 62vmin; height: 62vmin;
  image-rendering: pixelated; opacity: 0.07; filter: saturate(1.1);
  transform: rotate(-8deg);
}

/* ============================================================ App-Rahmen */
#app {
  position: relative; z-index: 1;
  height: 100%;
  display: flex; flex-direction: column;
  gap: var(--gap);
  padding-block: var(--gap);
  padding-left: max(var(--gap), env(safe-area-inset-left, 0px));
  padding-right: max(var(--gap), env(safe-area-inset-right, 0px));
}

/* ---- Waybar ---- */
#bar {
  display: flex; align-items: center; gap: 10px;
  min-height: 40px; padding: 4px 6px 4px 6px;
  background: var(--win);
  border: 1px solid var(--line);
  border-radius: var(--r);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
}
.bar-l, .bar-r { display: flex; align-items: center; gap: 8px; min-width: 0; }
.bar-l { flex: 1 1 0; }
.bar-r { flex: 1 1 0; justify-content: flex-end; }
.bar-c { display: flex; align-items: baseline; gap: 10px; flex: 0 1 auto; justify-content: center; min-width: 0; }
.brand { display: flex; align-items: center; gap: 8px; padding: 3px 10px 3px 4px; border-radius: 9px; }
.brand:hover { background: var(--win-hi); }
.brand img { width: 24px; height: 24px; image-rendering: pixelated; }
.brand-name { font: 600 17px/1 var(--f-px); letter-spacing: 0.02em; white-space: nowrap; }
.brand-name b { color: var(--accent-2); font-weight: 700; }
.ws {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 8px;
  background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 12px; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; max-width: 220px;
}
.ws img { width: 16px; height: 16px; image-rendering: pixelated; flex: none; }
.bar-bytes { font: 26px/1 var(--f-crt); color: var(--byte); white-space: nowrap; }
.bar-rate { color: var(--fg-2); font-size: 12px; white-space: nowrap; }
.clock { font-variant-numeric: tabular-nums; color: var(--fg-2); padding: 0 6px; font-size: 12px; }
.icon-btn { display: grid; place-items: center; width: 32px; height: 30px; border-radius: 8px; }
.icon-btn:hover { background: var(--win-hi); }
.icon-btn img { width: 18px; height: 14px; image-rendering: pixelated; }

.irc-btn {
  display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px; border-radius: 8px;
  background: #1d3350; border: 1px solid #3d8bff; color: #cfe3ff; font-size: 12px; font-weight: 700;
  animation: ircPulse 1.2s ease-in-out infinite;
}
.irc-btn img { width: 16px; height: 16px; image-rendering: pixelated; }
.irc-time { color: #8fb5e8; font-weight: 500; font-variant-numeric: tabular-nums; }
@keyframes ircPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(61, 139, 255, 0.55); } 50% { box-shadow: 0 0 0 6px rgba(61, 139, 255, 0); } }

/* Buff-Anzeigen */
.buffs { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.buff {
  display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px 2px 4px; border-radius: 999px;
  font-size: 11px; font-weight: 700; white-space: nowrap; position: relative; overflow: hidden;
  background: rgba(94, 224, 143, 0.14); border: 1px solid rgba(94, 224, 143, 0.4); color: #bff5d2;
}
.buff.bad { background: rgba(255, 98, 114, 0.13); border-color: rgba(255, 98, 114, 0.45); color: #ffc6cc; }
.buff.gold { background: rgba(255, 210, 63, 0.14); border-color: rgba(255, 210, 63, 0.5); color: #ffe9a8; }
.buff img { width: 16px; height: 16px; }
.buff .bt { font-weight: 500; opacity: 0.85; font-variant-numeric: tabular-nums; }
.buff::after { content: ""; position: absolute; left: 0; bottom: 0; height: 2px; width: var(--p, 100%); background: currentColor; opacity: 0.6; }
#bar-buffs .buff .bn { display: none; }

/* ---- News-Ticker ---- */
#ticker {
  display: flex; align-items: center; gap: 10px; min-height: 28px; padding: 0 12px 0 6px; overflow: hidden;
  background: var(--win); border: 1px solid var(--line); border-radius: 9px; cursor: pointer;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}

.stat { background: var(--win-hi); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.stat .k { color: var(--fg-3); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; }
.stat .v { font: 24px/1.1 var(--f-crt); color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.setup-wrap { position: relative; flex: 1 0 auto; border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); background: rgba(0, 0, 0, 0.35); min-height: 200px; }
#setup-cv { display: block; width: 100%; image-rendering: pixelated; }
.setup-empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px; color: var(--fg-3); }
.setup-empty b { color: var(--fg); display: block; font: 600 18px var(--f-px); margin-bottom: 6px; }

/* ============================================================ Erfolge */
.ach-sum { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 8px; }
.progress { position: relative; height: 10px; border-radius: 6px; background: rgba(0, 0, 0, 0.35); border: 1px solid var(--line); overflow: hidden; flex: 1; min-width: 140px; }
.progress > i { position: absolute; inset: 0 auto 0 0; width: var(--p, 0%); background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 6px; transition: width 0.4s; }
.progress.beard > i { background: linear-gradient(90deg, #a8693a, var(--beard)); }
.ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 50px)); justify-content: start; gap: 6px; }
.ach {
  position: relative; aspect-ratio: 1; border-radius: 9px; display: grid; place-items: center;
  background: rgba(0, 0, 0, 0.3); border: 1px solid var(--line);
}
.ach img { width: 32px; height: 32px; image-rendering: pixelated; }
.ach.on { border-color: color-mix(in srgb, var(--cc, var(--gold)) 70%, transparent); background: color-mix(in srgb, var(--cc, var(--gold)) 12%, rgba(0,0,0,.3)); }
.ach.off img { filter: brightness(0) invert(0.16); }
.ach.secret.off::after { content: "?"; position: absolute; font: 700 18px var(--f-px); color: var(--fg-3); }
.ach.fresh { animation: achFresh 1.2s ease-out 2; }
@keyframes achFresh { 50% { box-shadow: 0 0 0 4px var(--gold), 0 0 20px var(--gold); } }

/* ============================================================ Hop */
.hop-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
.distro-card { display: flex; gap: 14px; align-items: flex-start; }
.distro-logo { width: 64px; height: 64px; flex: none; image-rendering: pixelated; background: rgba(0, 0, 0, 0.3); border-radius: 14px; padding: 6px; border: 1px solid var(--line); }
.distro-card h3 { margin: 0 0 2px; font: 600 20px/1.15 var(--f-px); }
.distro-card .tag { color: var(--accent-2); font-weight: 700; font-size: 12px; margin-bottom: 6px; }
.perks { list-style: none; padding: 0; margin: 6px 0 0; display: flex; flex-direction: column; gap: 3px; font-size: 12px; }
.perks li::before { content: "•"; margin-right: 6px; color: var(--fg-3); }
.perks li.p1::before { content: "+"; color: var(--good); font-weight: 800; }
.perks li.p-1::before { content: "−"; color: var(--bad); font-weight: 800; }
.beard-card { display: flex; gap: 14px; align-items: center; }
#portrait { width: 84px; height: 84px; image-rendering: pixelated; flex: none; border-radius: 14px; background: color-mix(in srgb, var(--accent) 14%, rgba(0,0,0,.35)); border: 1px solid var(--line); }
.big-num { font: 36px/1 var(--f-crt); }
.big-num.beard { color: var(--beard); } .big-num.karma { color: var(--karma); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 12px; }
.kv dt { color: var(--fg-3); } .kv dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; }
.hop-card { display: flex; flex-direction: column; gap: 10px; }
.hop-gain { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-end; }
.hop-gain .lbl { color: var(--fg-3); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; }
.hop-note { color: var(--fg-3); font-size: 11.5px; }
.distro-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.dg {
  display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px 7px; border-radius: 10px; text-align: center;
  background: rgba(0, 0, 0, 0.25); border: 1px solid var(--line); font-size: 11px; font-weight: 700; min-width: 0;
}
.dg img { width: 34px; height: 34px; image-rendering: pixelated; }
.dg span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dg small { color: var(--fg-3); font-weight: 500; font-size: 10px; }
.dg.cur { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.dg.locked img { filter: brightness(0) invert(0.2); }
.dg.locked { color: var(--fg-3); }
.dg.visited small { color: var(--good); }

.tree { font: 13px/1.25 var(--f-ui); background: rgba(0, 0, 0, 0.35); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 6px; overflow-x: auto; }
.tr { display: flex; align-items: center; gap: 8px; width: 100%; padding: 4px 8px; border-radius: 7px; text-align: left; white-space: nowrap; min-height: 30px; }
.tr .br { color: var(--fg-3); white-space: pre; }
.tr .fn { font-weight: 700; }
.tr.dir .fn { color: #7aa2f7; }
.tr .cost { margin-left: auto; color: var(--karma); font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
.tr .cost img { width: 14px; height: 14px; image-rendering: pixelated; }
.tr .fx { color: var(--fg-3); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; }
.tr.owned .fn { color: var(--good); }
.tr.owned .cost { color: var(--good); }
.tr.can { background: color-mix(in srgb, var(--karma) 10%, transparent); }
.tr.can:hover { background: color-mix(in srgb, var(--karma) 18%, transparent); }
.tr.locked { opacity: 0.45; }
.tr.poor .cost { color: var(--bad); }
button.tr:not(.dir):hover { background: rgba(255, 255, 255, 0.05); }

/* ============================================================ System */
.neo { display: flex; gap: 18px; align-items: flex-start; font: 18px/1.1 var(--f-crt); background: var(--t-bg); color: var(--t-fg); border-radius: var(--r); padding: 14px 16px; overflow-x: auto; border: 1px solid var(--line); }
.neo pre { margin: 0; color: var(--t-prompt); font: inherit; text-shadow: 0 0 6px var(--t-glow); }
.neo .info { white-space: nowrap; text-shadow: 0 0 6px var(--t-glow); }
.neo .info b { color: var(--t-prompt); font-weight: 400; }
.neo .swatch { display: inline-block; width: 22px; height: 12px; margin-right: 2px; }
.set-list { display: flex; flex-direction: column; gap: 2px; }
.set-row { display: flex; align-items: center; gap: 12px; padding: 9px 4px; border-bottom: 1px solid var(--line); min-width: 0; }
.set-row:last-child { border-bottom: 0; }
.set-row .lab { flex: 1; min-width: 0; }
.set-row .lab small { display: block; color: var(--fg-3); font-size: 11px; }
.set-row select, .set-row input[type="range"] { max-width: 55%; }
select { background: rgba(0, 0, 0, 0.35); border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 8px; color: var(--fg); }
input[type="range"] { accent-color: var(--accent); }
.switch { position: relative; width: 42px; height: 24px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch i { position: absolute; inset: 0; border-radius: 12px; background: rgba(255, 255, 255, 0.12); transition: background 0.15s; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform 0.15s; }
.switch input:checked + i { background: var(--accent); }
.switch input:checked + i::after { transform: translateX(18px); }
.switch input:focus-visible + i { outline: 2px solid var(--accent-2); outline-offset: 2px; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw {
  width: 94px; border-radius: 10px; padding: 8px; text-align: left; border: 1px solid var(--line-2); font-size: 11px; font-weight: 700;
  display: flex; flex-direction: column; gap: 5px; min-height: 64px;
}
.sw .pal { display: flex; gap: 2px; }
.sw .pal i { flex: 1; height: 8px; border-radius: 2px; }
.sw.on { outline: 2px solid var(--accent); outline-offset: 1px; }
.sw.locked { opacity: 0.45; cursor: not-allowed; }
.sw small { font-weight: 500; opacity: 0.8; font-size: 10px; }
textarea { width: 100%; min-height: 80px; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--line-2); border-radius: 9px; color: var(--fg); padding: 8px 10px; font: 11.5px/1.4 var(--f-ui); resize: vertical; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.about p { margin: 0 0 8px; color: var(--fg-2); max-width: 68ch; }
.about h3 { font: 600 16px var(--f-px); margin: 14px 0 6px; }
.about ul { margin: 0 0 8px; padding-left: 18px; color: var(--fg-2); }
kbd { font: 700 11px var(--f-ui); padding: 1px 6px; border-radius: 5px; background: rgba(255,255,255,.08); border: 1px solid var(--line-2); border-bottom-width: 2px; }

/* ============================================================ Tooltip */
#tip {
  position: fixed; z-index: 60; left: 0; top: 0; width: min(330px, calc(100vw - 20px)); pointer-events: none;
  background: rgba(10, 13, 19, 0.97); border: 1px solid var(--line-2); border-radius: 12px; padding: 12px 13px;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55); font-size: 12px; line-height: 1.45;
}
.tip-h { display: flex; gap: 10px; align-items: center; margin-bottom: 6px; }
.tip-h img { width: 36px; height: 36px; image-rendering: pixelated; flex: none; background: rgba(0,0,0,.35); border-radius: 8px; padding: 3px; }
.tip-t { font: 600 15px/1.2 var(--f-px); }
.tip-k { color: var(--fg-3); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em; }
.tip-cost { margin-left: auto; font-weight: 800; color: var(--byte); white-space: nowrap; align-self: flex-start; }
.tip-cost.no { color: var(--bad); }
.tip-fx { color: var(--good); font-weight: 700; margin: 4px 0; }
.tip-fx.neg { color: var(--bad); }
.tip-fl { color: var(--fg-2); font-style: italic; margin-top: 6px; }
.tip-row { color: var(--fg-2); margin-top: 3px; }
.tip-row b { color: var(--fg); }

/* ============================================================ Toasts */
#toasts {
  position: fixed; z-index: 90; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); left: 50%; transform: translateX(-50%);
  display: flex; flex-direction: column; gap: 8px; width: min(380px, calc(100vw - 24px)); pointer-events: none;
}
.toast {
  pointer-events: auto; display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; cursor: pointer;
  background: rgba(12, 16, 23, 0.96); border: 1px solid var(--line-2); box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
  animation: toastIn 0.3s cubic-bezier(0.2, 1.4, 0.5, 1);
}
.toast.out { animation: toastOut 0.25s forwards; }
.toast img { width: 36px; height: 36px; flex: none; }
.toast .tt { font: 600 14px/1.2 var(--f-px); }
.toast .tx { color: var(--fg-2); font-size: 12px; line-height: 1.35; }
.toast .tk { color: var(--fg-3); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; }
.toast--ach { border-color: rgba(255, 210, 63, 0.55); background: linear-gradient(100deg, rgba(60, 46, 8, 0.97), rgba(12, 16, 23, 0.97) 60%); }
.toast--gold { border-color: rgba(255, 210, 63, 0.55); }
.toast--hint { border-color: color-mix(in srgb, var(--accent) 60%, transparent); }
.toast--bad { border-color: rgba(255, 98, 114, 0.5); }
@keyframes toastIn { from { transform: translateY(18px) scale(0.95); opacity: 0; } }
@keyframes toastOut { to { transform: translateY(18px); opacity: 0; } }
@media (max-width: 759.98px) {
  #toasts { bottom: auto; top: calc(env(safe-area-inset-top, 0px) + 50px); }
  @keyframes toastIn { from { transform: translateY(-16px) scale(0.95); opacity: 0; } }
  @keyframes toastOut { to { transform: translateY(-16px); opacity: 0; } }
}

/* ============================================================ Overlays & Modals */
#overlay-root > * { position: fixed; inset: 0; z-index: 80; }
.modal-bg { display: grid; place-items: center; padding: 16px; background: rgba(3, 5, 8, 0.66); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); animation: fadeIn 0.18s; }
@keyframes fadeIn { from { opacity: 0; } }
.modal {
  width: min(520px, 100%); max-height: calc(100dvh - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); overflow: auto;
  background: var(--win-solid); border-radius: 16px; border: 2px solid transparent;
  background: linear-gradient(var(--win-solid), var(--win-solid)) padding-box, linear-gradient(140deg, var(--accent), var(--accent-2), var(--wall2)) border-box;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6); animation: modalIn 0.25s cubic-bezier(0.2, 1.3, 0.5, 1);
}
@keyframes modalIn { from { transform: translateY(16px) scale(0.97); opacity: 0; } }
.modal-h { display: flex; align-items: center; gap: 12px; padding: 14px 16px 10px; }
.modal-h img { width: 40px; height: 40px; image-rendering: pixelated; flex: none; }
.modal-h h3 { margin: 0; font: 600 19px/1.2 var(--f-px); text-wrap: balance; }
.modal-h .x { margin-left: auto; width: 32px; height: 32px; border-radius: 8px; color: var(--fg-2); font-size: 18px; flex: none; }
.modal-h .x:hover { background: var(--win-hi); }
.modal-b { padding: 0 16px 12px; color: var(--fg-2); }
.modal-b p { margin: 0 0 10px; }
.modal-f { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 10px 16px 16px; }
@media (max-width: 759.98px) {
  .modal-bg.sheet { place-items: end center; padding: 0; }
  .modal-bg.sheet .modal { border-radius: 18px 18px 0 0; width: 100%; max-height: 82dvh; padding-bottom: env(safe-area-inset-bottom, 0px); animation: sheetIn 0.25s cubic-bezier(0.2, 1.1, 0.4, 1); }
  @keyframes sheetIn { from { transform: translateY(100%); } }
}

/* IRC & Quiz */
.irc-head { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--fg-3); margin-bottom: 8px; }
.irc-head b { color: #7aa2f7; }
.irc-msg { font: 20px/1.25 var(--f-crt); color: var(--t-fg); background: var(--t-bg); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; border: 1px solid var(--line); }
.irc-msg .nick { color: #7aa2f7; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { text-align: left; padding: 10px 12px; border-radius: 10px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line-2); font-weight: 700; color: var(--fg); transition: background 0.12s, border-color 0.12s; }
.opt:hover:not(:disabled) { background: rgba(255, 255, 255, 0.1); border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt.right { background: rgba(94, 224, 143, 0.18); border-color: var(--good); }
.opt.wrong { background: rgba(255, 98, 114, 0.16); border-color: var(--bad); }
.result { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--line); color: var(--fg); animation: fadeIn 0.3s; }
.result .eff { display: block; margin-top: 4px; font-weight: 800; color: var(--good); }
.result .eff.neg { color: var(--bad); }

/* GRUB */
.grub {
  background: #000; color: #aaa; font: 20px/1.2 var(--f-crt); display: flex; justify-content: center; align-items: flex-start;
  padding: max(3vh, env(safe-area-inset-top, 0px)) 14px max(2vh, env(safe-area-inset-bottom, 0px)); overflow: auto; animation: fadeIn 0.2s;
}
.grub::after { content: ""; position: fixed; inset: 0; pointer-events: none; background: repeating-linear-gradient(180deg, rgba(255,255,255,.02) 0 1px, transparent 1px 3px); }
.grub-inner { width: min(860px, 100%); display: flex; flex-direction: column; gap: 10px; }
.grub-title { text-align: center; color: #ddd; }
.grub-box { border: 2px solid #aaa; padding: 6px 4px; min-height: 0; }
.grub-list { list-style: none; margin: 0; padding: 0; }
.grub-list li { display: flex; gap: 12px; padding: 1px 8px; cursor: pointer; white-space: nowrap; overflow: hidden; }
.grub-list li .gn { overflow: hidden; text-overflow: ellipsis; }
.grub-list li .gr { margin-left: auto; color: #777; flex: none; }
.grub-list li.sel { background: #ddd; color: #000; }
.grub-list li.sel .gr { color: #333; }
.grub-list li.lock { color: #555; }
.grub-list li.lock.sel { background: #555; color: #bbb; }
.grub-help { color: #999; font-size: 18px; }
.grub-info { border: 1px dashed #555; padding: 10px 12px; color: #ccc; min-height: 150px; }
.grub-info .gi-h { display: flex; gap: 12px; align-items: center; }
.grub-info img { width: 48px; height: 48px; image-rendering: pixelated; }
.grub-info .gi-name { font-size: 26px; color: #fff; }
.grub-info .gi-tag { color: var(--gi, #aaa); }
.grub-info ul { margin: 6px 0 0; padding-left: 20px; }
.grub-info .g1 { color: #7ee787; } .grub-info .g-1 { color: #ff7b72; }
.grub-info .gi-gain { margin-top: 8px; color: #ffd166; }
.grub-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.grub-btn { font: 22px var(--f-crt); padding: 6px 16px; border: 2px solid #aaa; color: #ddd; background: #000; }
.grub-btn:hover, .grub-btn:focus-visible { background: #ddd; color: #000; outline: none; }
.grub-btn.go { border-color: #7ee787; color: #7ee787; }
.grub-btn.go:hover { background: #7ee787; color: #000; }
.grub-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* Boot-Animation */
.boot { background: #000; color: #ccc; font: 18px/1.2 var(--f-crt); padding: max(16px, env(safe-area-inset-top, 0px)) 16px 16px; overflow: hidden; cursor: pointer; }
.boot .bl { white-space: pre-wrap; word-break: break-all; }
.boot .ok { color: #3ddc84; } .boot .warn { color: #ffcb57; } .boot .hi { color: var(--bh, #fff); }
.boot .bar { display: inline-block; width: min(420px, 60vw); height: 16px; border: 1px solid #888; vertical-align: -2px; position: relative; }
.boot .bar i { position: absolute; inset: 1px auto 1px 1px; width: var(--p, 0%); background: #ccc; }
.boot .skip { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); color: #555; font-size: 16px; }
.boot.fade { animation: bootFade 0.6s forwards; }
@keyframes bootFade { to { opacity: 0; } }

/* Fenster-11-Update */
.winupd { background: #0a5bb5; color: #fff; display: grid; place-items: center; text-align: center; font-family: "Segoe UI", system-ui, sans-serif; animation: fadeIn 0.4s; cursor: wait; }
.winupd .spin { width: 46px; height: 46px; margin: 0 auto 26px; border-radius: 50%; border: 4px solid rgba(255,255,255,.25); border-top-color: #fff; animation: spin 1s linear infinite; }
.winupd h2 { font-weight: 300; font-size: clamp(20px, 3.5vw, 30px); margin: 0 0 8px; }
.winupd p { margin: 0; opacity: 0.85; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Finale */
.ending { background: radial-gradient(circle at 50% 30%, #1d1640, #05040a 70%); color: #fff; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
.ending h1 { font: 700 clamp(28px, 6vw, 64px)/1.05 var(--f-px); margin: 0 0 14px; background: linear-gradient(90deg, #ffd23f, #ff8fc7, #5ce1e6, #ffd23f); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shine 4s linear infinite; text-wrap: balance; }
@keyframes shine { to { background-position: 300% 0; } }
.ending .lines { min-height: 7em; max-width: 60ch; color: #d8d8f0; font-size: 15px; }
.ending .lines p { margin: 6px 0; animation: fadeIn 0.6s; }
.ending .credits { position: relative; height: 38vh; width: min(560px, 100%); overflow: hidden; mask-image: linear-gradient(transparent, #000 15%, #000 85%, transparent); }
.ending .credits .roll { position: absolute; left: 0; right: 0; top: 100%; animation: roll 38s linear forwards; }
.ending .credits h4 { margin: 18px 0 2px; color: #ffd23f; font: 600 14px var(--f-px); text-transform: uppercase; letter-spacing: 0.1em; }
.ending .credits p { margin: 0; color: #cfcfe8; }
@keyframes roll { to { transform: translateY(calc(-100% - 40vh)); } }
.ending img.crown-tux { width: 104px; height: 160px; image-rendering: pixelated; margin-bottom: 8px; animation: tuxHop 0.6s ease-in-out infinite; }

/* ============================================================ Akteure */
#actors { position: fixed; inset: 0; z-index: 50; pointer-events: none; overflow: hidden; }
.actor { position: absolute; left: 0; top: 0; pointer-events: auto; will-change: transform; touch-action: none; }
.duck { width: 64px; height: 64px; padding: 4px; filter: drop-shadow(0 0 10px rgba(255, 210, 63, 0.9)) drop-shadow(0 4px 4px rgba(0,0,0,.4)); }
.duck img { width: 56px; height: 56px; image-rendering: pixelated; display: block; }
.duck::before { content: ""; position: absolute; inset: -8px; border-radius: 50%; background: radial-gradient(rgba(255, 230, 120, 0.5), transparent 65%); animation: duckGlow 1s ease-in-out infinite; z-index: -1; }
@keyframes duckGlow { 50% { transform: scale(1.25); opacity: 0.6; } }
.bug { width: 48px; height: 48px; padding: 4px; filter: drop-shadow(0 2px 2px rgba(0,0,0,.5)); }
.bug img { width: 40px; height: 40px; image-rendering: pixelated; display: block; }
.splat { position: absolute; width: 40px; height: 40px; border-radius: 50%; background: radial-gradient(#7ee787 30%, rgba(126, 231, 135, 0.4) 55%, transparent 70%); animation: splat 0.9s forwards; }
@keyframes splat { from { transform: scale(0.3); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }
.btw { padding: 8px 12px; border-radius: 14px 14px 14px 4px; background: #1793d1; color: #fff; font: 700 13px var(--f-ui); box-shadow: 0 6px 20px rgba(23, 147, 209, 0.5); white-space: nowrap; transform-origin: 0 100%; }
.train { position: fixed; z-index: 55; left: 100%; top: 40%; pointer-events: none; font: 16px/1.05 var(--f-crt); color: #fff; white-space: pre; text-shadow: 0 0 8px rgba(255,255,255,.4); animation: train 5.5s linear forwards; }
@keyframes train { to { transform: translateX(calc(-100vw - 100%)); } }

/* ============================================================ Effekte */
#fx { position: fixed; inset: 0; z-index: 95; pointer-events: none; }
.shake { animation: shake 0.35s; }
@keyframes shake { 20% { transform: translate(-3px, 1px); } 40% { transform: translate(3px, -1px); } 60% { transform: translate(-2px, 1px); } 80% { transform: translate(2px, 0); } }
.pop { animation: popNum 0.3s ease-out; }
@keyframes popNum { 40% { transform: scale(1.08); } }

/* Hannah-Montana-Modus */
body.pink { --win: rgba(40, 12, 34, 0.86); --win-solid: #230a1d; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  .cursor { animation: none; }
}
body.reduce-motion *, body.reduce-motion *::before, body.reduce-motion *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }

/* ============================================================ Handy quer / sehr niedrige Fenster */
#tabs { scrollbar-width: none; }
#tabs::-webkit-scrollbar { display: none; }
@media (max-height: 520px) and (min-width: 560px) {
  :root { --gap: 6px; }
  #ticker { display: none; }
  #bar { min-height: 34px; padding: 2px 4px; }
  .brand-name, .clock { display: none; }
  .win-h { min-height: 32px; padding: 3px 8px 3px 10px; }
  .counter { padding: 4px 8px 2px; }
  .cnt-big { font-size: 34px; }
  .cnt-rate { margin-top: 2px; font-size: 11px; }
  .cnt-raw { display: none; }
  #term-buffs { margin-top: 3px; }
  .crt { margin: 2px 8px 6px; font-size: 16px; min-height: 60px; }
  .term-foot { display: none; }
  .tab { padding: 4px 9px; font-size: 11.5px; gap: 5px; }
  .tab img { width: 16px; height: 16px; }
  #w-center .panel { padding: 8px 10px 12px; }
  .win-b { padding: 8px 10px 10px; }
  .ph { margin-bottom: 8px; }
  .ph h2 { font-size: 18px; }
  .ph .sub { display: none; }
}

/* Handy: Blur kostet Akku und bringt bei fast deckenden Fenstern kaum etwas */
@media (max-width: 759.98px), (hover: none) and (pointer: coarse) {
  .win, #bar, #tabs, #ticker { backdrop-filter: none; -webkit-backdrop-filter: none; }
  .win, #bar, #tabs, #ticker { background: var(--win-solid); }
  .win-focus { background: linear-gradient(var(--win-solid), var(--win-solid)) padding-box, linear-gradient(140deg, var(--accent), var(--accent-2) 55%, color-mix(in srgb, var(--wall2) 80%, #fff 0%)) border-box; }
}

/* Endziel-Karte im Hop-Tab */
.goal-h { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; }
.goal-h img { width: 40px; height: 40px; image-rendering: pixelated; }
.goal-h .lbl { color: var(--fg-3); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; }
.goal-t { font: 600 17px/1.2 var(--f-px); color: var(--gold); }
.goal-rows { display: flex; flex-direction: column; gap: 6px; }
.goal-row { display: grid; grid-template-columns: minmax(120px, 1fr) minmax(80px, 2fr) auto; gap: 10px; align-items: center; font-size: 12px; }
.goal-row b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.goal-row.done { color: var(--good); }
.goal-row .progress > i { background: linear-gradient(90deg, #c98a00, var(--gold)); }
@media (max-width: 480px) { .goal-row { grid-template-columns: 1fr auto; } .goal-row .progress { grid-column: 1 / -1; grid-row: 2; } }
.upg-grid.is-empty { display: block; mask-image: none; }
@media (max-width: 759.98px) {
  #toasts { gap: 5px; width: min(360px, calc(100vw - 16px)); }
  .toast { padding: 6px 10px; gap: 8px; border-radius: 10px; }
  .toast img { width: 28px; height: 28px; }
  .toast .tt { font-size: 13px; }
  .toast .tk { font-size: 9px; }
  .toast .tx { font-size: 11px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
}
/* Bei Vollbild-Overlays (GRUB, Boot, Update, Finale) keine Toasts */
body:has(#overlay-root > .grub, #overlay-root > .boot, #overlay-root > .winupd, #overlay-root > .ending) #toasts { display: none; }
@media (max-width: 759.98px) {
  .setup-stats { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-bottom: 8px; }
  .stat { padding: 5px 8px; border-radius: 8px; }
  .stat .k { font-size: 9px; }
  .stat .v { font-size: 19px; }
}
@media (max-width: 759.98px) and (max-height: 640px) {
  #ticker { display: none; }
  #w-term { height: clamp(190px, 38dvh, 290px); }
  .term-foot { display: none; }
  .cnt-big { font-size: 36px; }
}
#bar-buffs { flex-wrap: nowrap; overflow: hidden; }
.buff.more { padding: 2px 7px; color: var(--fg-2); background: rgba(255,255,255,.06); border-color: var(--line-2); }
#term-buffs { max-height: 52px; overflow: hidden; }
.kbd { cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
.key:hover { color: var(--fg-2); }
.ws { cursor: pointer; }

/* Hop-Historie */
.hop-log { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; }
.hl-row { display: grid; grid-template-columns: 34px 18px 14px 18px minmax(0, 1fr) auto; gap: 6px; align-items: center; font-size: 12px; padding: 3px 0; border-bottom: 1px dashed var(--line); }
.hl-row:last-child { border-bottom: 0; }
.hl-row img { width: 18px; height: 18px; image-rendering: pixelated; }
.hl-n { color: var(--fg-3); font-variant-numeric: tabular-nums; }
.hl-arrow { color: var(--fg-3); text-align: center; }
.hl-name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hl-gain { color: var(--beard); font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; }
.hl-meta { grid-column: 5 / -1; color: var(--fg-3); font-size: 11px; margin-top: -3px; }

.tip-row.bad { color: var(--bad); }
.about p.muted { color: var(--fg-3); }
/* Top-Deal-Markierung */
.bld.best::after { content: "Top-Deal"; position: absolute; top: 5px; right: 8px; font: 800 9px/1 var(--f-ui); letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 5px; border-radius: 5px; background: var(--accent-soft); color: var(--accent-2); border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent); }
@media (hover: none), (pointer: coarse) { .bld.best::after { right: 44px; } }

</style>

<script>
/* ---- js/util.js ---- */
'use strict';
/* DistroHopper – Hilfsfunktionen: Zahlenformat, DOM, Zufall */
var DH = (typeof window !== 'undefined' ? (window.DH = window.DH || {}) : (globalThis.DH = globalThis.DH || {}));

(function () {
  const U = DH.util = {};

  U.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  U.lerp = (a, b, t) => a + (b - a) * t;
  U.rand = (a, b) => a + Math.random() * (b - a);
  U.randInt = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
  U.pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  U.chance = (p) => Math.random() < p;
  U.shuffle = (arr) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };
  U.weighted = (items, key = 'w') => {
    let total = 0;
    for (const it of items) total += it[key];
    let r = Math.random() * total;
    for (const it of items) { r -= it[key]; if (r <= 0) return it; }
    return items[items.length - 1];
  };
  U.now = () => Date.now();

  /* ---------- DOM ---------- */
  U.$ = (sel, root) => (root || document).querySelector(sel);
  U.$$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  U.esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  U.h = (tag, attrs, ...kids) => {
    const el = document.createElement(tag);
    if (attrs) {
      for (const k in attrs) {
        const v = attrs[k];
        if (v == null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'html') el.innerHTML = v;
        else if (k === 'text') el.textContent = v;
        else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
        else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
        else el.setAttribute(k, v === true ? '' : v);
      }
    }
    for (const kid of kids.flat()) {
      if (kid == null || kid === false) continue;
      el.appendChild(typeof kid === 'string' || typeof kid === 'number' ? document.createTextNode(String(kid)) : kid);
    }
    return el;
  };
  U.setText = (el, txt) => { if (el && el.textContent !== txt) el.textContent = txt; };
  U.setHTML = (el, html) => { if (el && el._html !== html) { el.innerHTML = html; el._html = html; } };
  U.toggleClass = (el, cls, on) => { if (el && el.classList.contains(cls) !== !!on) el.classList.toggle(cls, !!on); };

  /* ---------- Zahlen ---------- */
  U.settings = { notation: 'si' }; // si | bin | short | sci

  // deutsche Dezimaldarstellung
  U.dec = (v, d) => {
    let s = v.toFixed(d);
    if (d > 0) s = s.replace('.', ',');
    return s;
  };
  U.trimDec = (v, d) => {
    let s = v.toFixed(d);
    if (d > 0) s = s.replace(/\.?0+$/, '');
    return s.replace('.', ',');
  };
  U.group = (n) => {
    const s = Math.floor(Math.abs(n)).toString();
    return (n < 0 ? '−' : '') + s.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  };

  const SI = ['B', 'KB', 'MB', 'GB', 'TB', 'PB', 'EB', 'ZB', 'YB', 'RB', 'QB'];
  const BIN = ['B', 'KiB', 'MiB', 'GiB', 'TiB', 'PiB', 'EiB', 'ZiB', 'YiB', 'RiB', 'QiB'];
  const SHORT = ['', 'Tsd.', 'Mio.', 'Mrd.', 'Bio.', 'Brd.', 'Trio.', 'Trd.', 'Quad.', 'Quadrd.', 'Quint.', 'Quintd.', 'Sext.', 'Sextd.', 'Sept.', 'Septd.', 'Okt.', 'Oktd.', 'Non.', 'Nond.', 'Dez.', 'Dezd.'];

  function sig(v, digits, steady) {
    // v in [1, 1000) -> String mit ~digits signifikanten Stellen, höchstens 2 Nachkommastellen
    // ("1,234 MB" sähe aus wie eintausendzweihundertvierunddreißig). Ohne steady fallen
    // angehängte Nullen weg, steady hält die Breite für den großen Zähler fest.
    const d = Math.min(2, v >= 100 ? Math.max(0, digits - 3) : v >= 10 ? Math.max(0, digits - 2) : Math.max(0, digits - 1));
    return steady ? U.dec(v, d) : U.trimDec(v, d);
  }

  function sci(n, digits) {
    const e = Math.floor(Math.log10(n));
    const m = n / Math.pow(10, e);
    return U.dec(m, Math.min(2, digits - 1)) + 'e' + e;
  }

  // Bytes formatieren. precise: 4 signifikante Stellen (für den großen Zähler)
  U.bytes = (n, precise) => {
    if (!isFinite(n)) return '∞ B';
    if (n < 0) return '−' + U.bytes(-n, precise);
    const digits = precise ? 4 : 3;
    const mode = U.settings.notation;
    if (n < 1000 || (mode === 'bin' && n < 1024)) {
      if (n === 0) return '0 B';
      if (n < 10 && n % 1 !== 0) return U.trimDec(n, n < 1 ? 2 : 1) + ' B';
      return Math.floor(n) + ' B';
    }
    if (mode === 'sci') return sci(n, digits) + ' B';
    if (mode === 'short') {
      const e = Math.floor(Math.log10(n) / 3);
      if (e < SHORT.length) return sig(n / Math.pow(1000, e), digits, precise) + ' ' + SHORT[e] + ' B';
      return sci(n, digits) + ' B';
    }
    if (mode === 'bin') {
      const e = Math.floor(Math.log(n) / Math.log(1024));
      if (e < BIN.length) {
        let v = n / Math.pow(1024, e);
        if (v >= 1000) return sig(v, digits + 1, precise).replace(/,\d+$/, '') + ' ' + BIN[e];
        return sig(v, digits, precise) + ' ' + BIN[e];
      }
      return sci(n, digits) + ' B';
    }
    const e = Math.floor(Math.log10(n) / 3 + 1e-9);
    if (e < SI.length) {
      let v = n / Math.pow(1000, e);
      if (v >= 999.95 && e + 1 < SI.length) return sig(v / 1000, digits, precise) + ' ' + SI[e + 1];
      return sig(v, digits, precise) + ' ' + SI[e];
    }
    return sci(n, digits) + ' B';
  };
  U.rate = (n) => U.bytes(n) + '/s';

  // allgemeine Zahl (Anzahl, Barthaare …)
  U.num = (n, dec = 0) => {
    if (!isFinite(n)) return '∞';
    if (Math.abs(n) < 1e6) return dec && n % 1 !== 0 ? U.trimDec(n, dec) : U.group(Math.floor(n));
    if (U.settings.notation === 'sci') return sci(n, 3);
    const e = Math.floor(Math.log10(Math.abs(n)) / 3);
    if (e < SHORT.length) return sig(n / Math.pow(1000, e), 3) + ' ' + SHORT[e];
    return sci(n, 3);
  };
  U.pct = (v, d = 0) => U.trimDec(v * 100, d) + ' %';
  U.mult = (v) => '×' + (v >= 100 ? U.num(v) : U.trimDec(v, v < 10 ? 2 : 1));

  U.dur = (sec) => {
    sec = Math.max(0, Math.floor(sec));
    if (sec < 60) return sec + ' s';
    const m = Math.floor(sec / 60), s = sec % 60;
    if (m < 60) return m + ' min' + (s ? ' ' + s + ' s' : '');
    const h = Math.floor(m / 60), mm = m % 60;
    if (h < 24) return h + ' h' + (mm ? ' ' + mm + ' min' : '');
    const d = Math.floor(h / 24), hh = h % 24;
    if (d < 365) return d + ' T' + (hh ? ' ' + hh + ' h' : '');
    const y = Math.floor(d / 365);
    return y + ' J ' + (d % 365) + ' T';
  };
  U.clockDur = (sec) => {
    sec = Math.max(0, Math.ceil(sec));
    const m = Math.floor(sec / 60), s = sec % 60;
    return m + ':' + String(s).padStart(2, '0');
  };

  /* ---------- Speicher ---------- */
  U.store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* egal */ } },
  };

  // UTF-8-sicheres Base64
  U.b64enc = (str) => {
    const bytes = new TextEncoder().encode(str);
    let bin = '';
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  };
  U.b64dec = (b64) => {
    const bin = atob(b64.trim());
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  };

  const handlers = {};
  DH.bus = {
    on(ev, fn) { (handlers[ev] = handlers[ev] || []).push(fn); },
    emit(ev, ...args) { const hs = handlers[ev]; if (hs) for (const fn of hs) { try { fn(...args); } catch (e) { console.error(ev, e); } } },
  };

  U.isTouch = () => (typeof window !== 'undefined') && window.matchMedia && window.matchMedia('(hover: none)').matches;
  U.reducedMotion = () => (typeof window !== 'undefined') && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
})();

    P: '110101110100100', Q: '010101101110011', R: '110101110101101', S: '011100010001110', T: '111010010010010',
    U: '101101101101111', V: '101101101101010', W: '101101111111101', X: '101101010101101', Y: '101101010010010',
    Z: '111001010100111', 0: '111101101101111', 1: '010110010010111', 2: '110001010100111', 3: '110001010001110',
    4: '101101111001001', 5: '111100110001110', 6: '011100111101111', 7: '111001010010010', 8: '111101111101111',
    9: '111101111001110', '!': '010010010000010', '?': '110001010000010', '$': '011110010011110', '_': '000000000000111',
    '-': '000000111000000', '>': '100010001010100', '/': '001001010100100', '.': '000000000000010', ':': '000010000010000',
    '+': '000010111010000', '#': '101111101111101', '~': '000011110000000', '*': '101010101000000', '<': '001010100010001',
    '|': '010010010010010', '=': '000111000111000', ' ': '000000000000000',

  // rows -> canvas
  function rasterize(rows, opt) {
    const w = Math.max(...rows.map((r) => r.length));
    const h = rows.length;
    const c = makeCanvas(w, h);
    const ctx = c.getContext('2d');
    const img = ctx.createImageData(w, h);
    const map = (opt && opt.map) || null;
    const sil = opt && opt.silhouette;
    for (let y = 0; y < h; y++) {
      const row = rows[y];
      for (let x = 0; x < w; x++) {
        const ch = row[x];
        if (!ch || ch === '.') continue;
        let col = (map && map[ch]) || P[ch];
        if (!col) continue;
        if (sil) col = sil;
        const [r, g, b] = hexToRgb(col);
        const i = (y * w + x) * 4;
        img.data[i] = r; img.data[i + 1] = g; img.data[i + 2] = b; img.data[i + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    return c;
  }

        if (g[i] === '1') ctx.fillRect(cx + (i % 3) * scale, y + Math.floor(i / 3) * scale, scale, scale);
      }
      cx += 4 * scale;
    }
    return cx - x;
  };

  SP.tierColors = ['#c98a4b', '#c7ced8', '#ffd23f', '#5ce1e6', '#3ddc84', '#a86fff', '#ef3e4a', '#ff8fc7', '#ffffff', '#ff7b25', '#7ebae4'];

  // Upgrade-Icon: Grafik + Stufen-Juwel unten rechts

    ctx.drawImage(base, 0, 0);
    const col = SP.tierColors[(tier - 1) % SP.tierColors.length];

    ctx.fillStyle = P.k;
    ctx.fillRect(13, 11, 4, 1); ctx.fillRect(12, 12, 6, 4); ctx.fillRect(13, 16, 4, 1);
    ctx.fillStyle = col;

  SP.letterIcon = (txt, bg, fg) => {
    if (!isBrowser) return '';

    if (cache.has(k)) return cache.get(k);
    const c = makeCanvas(16, 16);
    const ctx = c.getContext('2d');
    ctx.fillStyle = P.k; ctx.fillRect(1, 1, 14, 14);

    px(P.k, 8, 5, 16, 19); px(P.s, 9, 6, 14, 17);
    px(P.S, 9, 20, 14, 3);
    // Ohren
    px(P.k, 7, 12, 2, 5); px(P.s, 7, 13, 1, 3); px(P.k, 23, 12, 2, 5); px(P.s, 24, 13, 1, 3);
    // Haare
    px(P.k, 8, 3, 16, 5); px(hc, 9, 4, 14, 4); px(hc, 8, 7, 2, 4); px(hc, 22, 7, 2, 4);
    px(shade(hc, 0.25), 11, 4, 5, 1);
    // Brille
    px(P.k, 9, 11, 6, 5); px(P.k, 17, 11, 6, 5); px(P.k, 15, 12, 2, 1);
    px('#9fd8ff', 10, 12, 4, 3); px('#9fd8ff', 18, 12, 4, 3);
    px(P.w, 10, 12, 1, 1); px(P.w, 18, 12, 1, 1);
    px(P.k, 12, 13, 1, 1); px(P.k, 20, 13, 1, 1);
    // Nase & Mund
    px(P.S, 15, 15, 2, 3);
    px(P.R, 14, 19, 4, 1);
    // Bart
    if (beardStage > 0) {
      const len = [0, 0, 2, 4, 6, 8, 10, 12, 14][Math.min(8, beardStage)];
      if (beardStage === 1) {
        // Dreitagebart: Schatten + Stoppeln
        x.fillStyle = 'rgba(74,51,34,0.28)';
        x.fillRect(10, 17, 12, 6); x.fillRect(9, 14, 1, 7); x.fillRect(22, 14, 1, 7);
        x.fillStyle = shade(grey, 0.05);
        for (let yy = 17; yy < 23; yy++) for (let xx = 10; xx < 22; xx++) if ((xx * 3 + yy * 5) % 4 === 0) x.fillRect(xx, yy, 1, 1);
        px(P.R, 14, 19, 4, 1);
      } else {
        // Koteletten
        px(grey, 9, 12, 1, 8); px(grey, 22, 12, 1, 8);
        // Schnurrbart
        px(grey, 12, 17, 8, 2); px(P.R, 14, 19, 4, 1);
        // Bart
        const top = 19;
        for (let i = 0; i < len + 4; i++) {
          const yy = top + i;
          const half = Math.max(1, Math.round(7 - Math.max(0, i - 2) * (6 / Math.max(4, len + 2))));
          px(P.k, 16 - half - 1, yy, half * 2 + 2, 1);
          px(grey, 16 - half, yy, half * 2, 1);
          if (i % 3 === 1) px(shade(grey, -0.2), 16 - half + 1, yy, 1, 1);
          if (i % 3 === 2) px(shade(grey, 0.2), 16 + half - 2, yy, 1, 1);
        }
        px(P.R, 14, 19, 4, 1);
        px(P.k, 13, 20, 6, 1); px(grey, 14, 20, 4, 1);
      }
    }
    cache.set(k, c);
    return c;

'use strict';
/* DistroHopper – Spiellogik (ohne DOM, damit sie auch in Node simuliert werden kann) */
(function () {
  const D = DH.data;
  const SAVE_KEY = 'distrohopper-save-v1';
  const HOP_DIV = 1e9;
  const COST_GROWTH = 1.15;

  const G = DH.game = {
    S: null,
    HOP_DIV, BEARD_K: 0.25, BEARD_EXP: 0.6, CF_MULT: 77, HA: 0.7, HB: 0.61, HL0: 8,
    // abgeleitete Werte
    bps: 0, bpsBase: 0, click: 1, prodMult: 1, perUnit: {}, bCostMult: 1, uCostMult: 1,
    totalBuildings: 0, upgradesOwned: 0, clickPct: 0, duckFreq: 1, duckPow: 1, duckLife: 1, buffDur: 1,
    bugMult: 1, bugFreq: 1, ircFreq: 1, ircMult: 1, quizMult: 1, offlineEff: 0.25, offlineCap: 24, hopMult: 1,
    achMult: 1, beardMult: 1, positiveBuffs: 0, keep: 0, nAch: 0, gentooMult: 1, flags: {},
    prodBuff: 1, clickBuff: 1,
  };

  /* ================================================================ Zustand */
  function newState() {
    const now = Date.now();
    const b = {};
    D.buildings.forEach((x) => { b[x.id] = 0; });
    return {
      v: 1,
      bytes: 0, runBytes: 0, allBytes: 0,
      b,
      u: {},
      choices: {},
      ach: {},
      distro: 'ubuntu',
      visited: { ubuntu: 1 },
      unlocked: {},
      hops: 0,
      beard: 0, beardBase: 0, karma: 0,
      dotfiles: {},
      buffs: [],
      secrets: {},
      runClicks: 0,
      runStart: now,
      lastRunB: {},
      won: false,
      seen: {},
      tut: {},
      daily: { last: '', streak: 0, best: 0 },
      stats: {
        clicks: 0, clickBytes: 0, ducks: 0, bugs: 0, irc: 0, quizRight: 0, quizWrong: 0, playTime: 0,
        btw: 0, updates: 0, tuxPokes: 0, bestHop: 0, fastHop: false, night: false, longAway: false,
        bulk100: false, buyAllUsed: false, maxBps: 0, startTime: now, upgradesBought: 0, buildingsBought: 0,
        hairsTotal: 0,
      },
      settings: {
        sound: true, vol: 0.55, keySound: 'rubber', notation: 'si', particles: true, shake: true, vibrate: true,
        keysAsClicks: true, scheme: 'distro', hat: 'auto', autoUpg: false, autoBld: false, qty: '1', news: true, crt: true, music: false, mvol: 0.4, bestDeal: true,
      },
      lastSave: now,
    };
  }
  G.newState = newState;

  function merge(def, src) {
    if (!src || typeof src !== 'object') return def;
    for (const k in def) {
      if (!(k in src)) continue;
      const dv = def[k], sv = src[k];
      if (dv && typeof dv === 'object' && !Array.isArray(dv)) def[k] = merge(dv, sv);
      else def[k] = sv;
    }
    // zusätzliche Schlüssel in Maps übernehmen (u, ach, visited …)
    for (const k in src) if (!(k in def)) def[k] = src[k];
    return def;
  }

  /* ================================================================ Laden/Speichern */
  G.load = () => {
    const raw = DH.util.store.get(SAVE_KEY);
    G.S = newState();
    if (raw) {
      try { G.S = merge(newState(), JSON.parse(raw)); } catch (e) { console.warn('Spielstand defekt', e); }
    }
    sanitize();
    G.recalc();
    return !!raw;
  };
  G.loadFrom = (obj) => { G.S = merge(newState(), obj); sanitize(); G.recalc(); };
  function sanitize() {
    const S = G.S;
    if (!D.dIndex[S.distro]) S.distro = 'ubuntu';
    for (const k of ['bytes', 'runBytes', 'allBytes', 'beard', 'karma', 'beardBase']) if (!isFinite(S[k]) || S[k] < 0) S[k] = 0;
    D.buildings.forEach((x) => { if (!isFinite(S.b[x.id])) S.b[x.id] = 0; });
    S.buffs = (S.buffs || []).filter((b) => b && b.end > Date.now());
  }
  G.save = () => {
    if (!G.S) return false;
    G.S.lastSave = Date.now();
    return DH.util.store.set(SAVE_KEY, JSON.stringify(G.S));
  };
  G.exportSave = () => 'DH1:' + DH.util.b64enc(JSON.stringify(G.S));
  G.importSave = (str) => {
    str = String(str || '').trim();
    if (str.startsWith('DH1:')) str = str.slice(4);
    const obj = JSON.parse(DH.util.b64dec(str));
    if (!obj || typeof obj !== 'object' || !('bytes' in obj)) throw new Error('Kein gültiger Spielstand');
    G.loadFrom(obj);
    G.save();
  };
  G.wipe = (keepSettings) => {
    const settings = G.S && G.S.settings;
    G.S = newState();
    if (keepSettings && settings) G.S.settings = settings;
    G.recalc();
    G.save();
  };

  /* ================================================================ Abgeleitete Werte */
  G.distro = () => D.dIndex[G.S.distro];
  // Besuchte reguläre Distros (geheime zählen nicht für Ziele)
  G.visitedCount = () => Object.keys(G.S.visited).filter((k) => D.dIndex[k] && !D.dIndex[k].secret).length;
  G.runSeconds = () => (Date.now() - G.S.runStart) / 1000;

  G.recalc = () => {
    const S = G.S;
    const dist = D.dIndex[S.distro];
    const dm = dist.mods || {};
    const f = G.flags = {};

    // Dotfiles
    let dfClick = 1, dfClickPct = 0, dfProd = 1, dfB = 1, dfU = 1, beardEff = 1, achEffAdd = 0, offline = 0.25, offlineCap = 24;
    let duckFreq = 1, buffDur = 1, duckLife = 1, ircFreq = 1, ircMult = 1, bugMult = 1, quizMult = 1, hopMult = 1, keep = 0;
    for (const id in S.dotfiles) {
      const d = D.dfIndex[id];
      if (!d || !d.eff) continue;
      const e = d.eff;
      if (e.click) dfClick *= e.click;
      if (e.clickPct) dfClickPct += e.clickPct;
      if (e.prod) dfProd *= e.prod;
      if (e.bCost) dfB *= e.bCost;
      if (e.uCost) dfU *= e.uCost;
      if (e.beardEff) beardEff += e.beardEff;
      if (e.achEff) achEffAdd += e.achEff;
      if (e.offline) offline += e.offline;
      if (e.offlineCap) offlineCap = Math.max(offlineCap, e.offlineCap);
      if (e.duckFreq) duckFreq *= e.duckFreq;
      if (e.buffDur) buffDur *= e.buffDur;
      if (e.duckLife) duckLife *= e.duckLife;
      if (e.ircFreq) ircFreq *= e.ircFreq;
      if (e.ircMult) ircMult *= e.ircMult;
      if (e.bugMult) bugMult *= e.bugMult;
      if (e.quizMult) quizMult *= e.quizMult;
      if (e.hopMult) hopMult *= e.hopMult;
      if (e.keep) keep += e.keep;
      if (e.buyAll) f.buyAll = true;
      if (e.autoUpg) f.autoUpg = true;
      if (e.autoBld) f.autoBld = true;
      if (e.prompt) f.prompt = true;
    }

    // Upgrades
    const tiers = {};
    let prodUp = 1, clickMult = 1, clickPct = 0, cats = 0, bugFreq = 1, swClick = 1, swProd = 1, swCost = 1, swB = 1, swU = 1, swAch = 1;
    const syns = [];
    let owned = 0;
    for (const id in S.u) {
      const u = D.uIndex[id];
      if (!u) continue;
      owned++;
      switch (u.type) {
        case 'tier': tiers[u.b] = (tiers[u.b] || 0) + 1; break;
        case 'syn': syns.push(u); break;
        case 'click': if (u.mult) clickMult *= u.mult; if (u.pct) clickPct += u.pct; break;
        case 'prod': prodUp *= 1 + u.add; break;
        case 'cat': cats += u.add; break;
        case 'duck': if (u.freq) duckFreq *= u.freq; if (u.dur) buffDur *= u.dur; if (u.pow) f.duckPowUp = (f.duckPowUp || 1) * u.pow; break;
        case 'bug': if (u.bugMult) bugMult *= u.bugMult; if (u.bugFreq) bugFreq *= u.bugFreq; break;
        case 'switch': {
          const e = u.eff;
          if (e.click) swClick *= e.click;
          if (e.prod) swProd *= e.prod;
          if (e.cost) swCost *= e.cost;
          if (e.bCost) swB *= e.bCost;
          if (e.uCost) swU *= e.uCost;
          if (e.buffDur) buffDur *= e.buffDur;
          if (e.duckFreq) duckFreq *= e.duckFreq;
          if (e.achEff) swAch *= e.achEff;
          if (e.ircMult) ircMult *= e.ircMult;
          break;
        }
        default: break;
      }
    }
    G.upgradesOwned = owned;

    // Gebäude
    const noSyn = dist.special === 'nosyn';
    let raw = 0, total = 0;
    for (const b of D.buildings) {
      let m = Math.pow(2, tiers[b.id] || 0);
      if (!noSyn) {
        for (const s of syns) {
          if (s.a === b.id) m *= 1 + 0.05 * S.b[s.b];
          if (s.b === b.id) m *= 1 + 0.001 * S.b[s.a];
        }
      }
      G.perUnit[b.id] = b.bps * m;
      raw += G.perUnit[b.id] * S.b[b.id];
      total += S.b[b.id];
    }
    G.totalBuildings = total;

    // Globale Multiplikatoren
    const nAch = Object.keys(S.ach).length;
    G.nAch = nAch;
    G.achMult = 1 + nAch * 0.01 * (1 + cats) * (1 + achEffAdd) * swAch;
    G.beardMult = 1 + G.BEARD_K * Math.pow(S.beard, G.BEARD_EXP) * beardEff;
    G.gentooMult = dist.special === 'gentoo' ? Math.min(6, 0.5 + 0.04 * (G.runSeconds() / 60)) : 1;
    G.prodMult = prodUp * (dm.prod || 1) * swProd * dfProd * G.achMult * G.beardMult * G.gentooMult * (S.won ? 2 : 1);
    G.bpsBase = raw * G.prodMult;

    // Buffs
    let pb = 1, cb = 1, pos = 0;
    const now = Date.now();
    for (const bf of S.buffs) {
      if (bf.end <= now) continue;
      if (bf.kind === 'click') cb *= bf.mult; else pb *= bf.mult;
      if (bf.mult > 1) pos++;
    }
    G.prodBuff = pb; G.clickBuff = cb; G.positiveBuffs = pos;
    G.bps = G.bpsBase * pb;

    G.clickPct = clickPct + dfClickPct;
    G.clickMultTotal = clickMult * (dm.click || 1) * swClick * dfClick;
    G.click = (G.clickMultTotal + G.bps * G.clickPct) * cb;

    G.bCostMult = (dm.bCost || 1) * dfB * swB * swCost;
    G.uCostMult = (dm.uCost || 1) * dfU * swU * swCost;
    G.duckFreq = (dm.duckFreq || 1) * duckFreq;
    G.duckPow = (dm.duckPow || 1) * (f.duckPowUp || 1);
    G.duckLife = duckLife;
    G.buffDur = (dm.buffDur || 1) * buffDur;
    G.bugMult = bugMult;
    G.bugFreq = (dm.bugFreq || 1) * bugFreq;
    G.ircFreq = (dm.ircFreq || 1) * ircFreq;
    G.ircMult = ircMult;
    G.quizMult = quizMult;
    G.offlineEff = offline * (dm.offline || 1);
    G.offlineCap = offlineCap;
    G.hopMult = (dm.hopMult || 1) * hopMult;
    G.keep = keep;
  };

  /* ================================================================ Einnahmen */
  function earn(n) {
    if (!(n > 0) || !isFinite(n)) return;
    const S = G.S;
    S.bytes += n; S.runBytes += n; S.allBytes += n;
  }
  G.earn = earn;

  G.doClick = () => {
    const v = G.click;
    earn(v);
    const st = G.S.stats;
    st.clicks++; st.clickBytes += v;
    G.S.runClicks++;
    return v;
  };

  /* ================================================================ Gebäude */
  G.bCost = (id, n = 1) => {
    const b = D.bIndex[id];
    const owned = G.S.b[id];
    const base = b.cost * G.bCostMult * Math.pow(COST_GROWTH, owned);
    return base * (Math.pow(COST_GROWTH, n) - 1) / (COST_GROWTH - 1);
  };
  G.maxBuy = (id) => {
    const b = D.bIndex[id];
    const base = b.cost * G.bCostMult * Math.pow(COST_GROWTH, G.S.b[id]);
    if (G.S.bytes < base) return 0;
    return Math.floor(Math.log(G.S.bytes * (COST_GROWTH - 1) / base + 1) / Math.log(COST_GROWTH));
  };
  G.qtyFor = (id, qty) => {
    if (qty === 'max') return Math.max(1, G.maxBuy(id));
    return +qty || 1;
  };
  G.revealed = (b) => G.S.b[b.id] > 0 || G.S.runBytes >= b.cost * G.bCostMult * 0.4 || G.S.bytes >= b.cost * G.bCostMult * 0.4;
  G.buyBuilding = (id, n) => {
    n = Math.max(1, Math.floor(n));
    const cost = G.bCost(id, n);
    if (G.S.bytes < cost) return 0;
    G.S.bytes -= cost;
    G.S.b[id] += n;
    G.S.stats.buildingsBought += n;
    if (n >= 100) G.S.stats.bulk100 = true;
    G.recalc();
    DH.bus.emit('building', id, n);
    return n;
  };

  /* ================================================================ Upgrades */
  G.uCost = (u) => u.cost * G.uCostMult;
  G.upgradeVisible = (u) => {
    const S = G.S;
    if (S.u[u.id]) return false;
    switch (u.type) {
      case 'tier': return S.b[u.b] >= u.need;
      case 'syn': return S.b[u.a] >= u.need && S.b[u.b] >= u.need;
      case 'switch': if (S.choices[u.group]) return false; break;
      case 'final': if (S.won) return false; break;
      default: break;
    }
    const un = u.unl;
    if (!un) return true;
    if (un.req && !S.u[un.req]) return false;
    if (un.clicks != null && S.stats.clicks < un.clicks) return false;
    if (un.bytes != null && S.runBytes < un.bytes) return false;
    if (un.ach != null && G.nAch < un.ach) return false;
    if (un.ducks != null && S.stats.ducks < un.ducks) return false;
    if (un.bugs != null && S.stats.bugs < un.bugs) return false;
    if (un.beard != null && S.beard < un.beard) return false;
    if (un.visited != null && G.visitedCount() < un.visited) return false;
    return true;
  };
  G.visibleUpgrades = () => D.upgrades.filter(G.upgradeVisible).sort((a, b) => G.uCost(a) - G.uCost(b));
  G.buyUpgrade = (id) => {
    const u = D.uIndex[id];
    if (!u || G.S.u[id] || !G.upgradeVisible(u)) return false;
    const cost = G.uCost(u);
    if (G.S.bytes < cost) return false;
    G.S.bytes -= cost;
    G.S.u[id] = 1;
    G.S.stats.upgradesBought++;
    G.S.stats['had_' + id] = 1;
    if (u.type === 'switch') G.S.choices[u.group] = u.id;
    if (u.type === 'final') G.S.won = true;
    G.recalc();
    DH.bus.emit('upgrade', u);
    if (u.type === 'final') DH.bus.emit('won');
    return true;
  };
  G.buyAllUpgrades = () => {
    let n = 0;
    for (const u of G.visibleUpgrades()) {
      if (u.type === 'switch' || u.type === 'final') continue;
      if (G.S.bytes >= G.uCost(u) && G.buyUpgrade(u.id)) n++;
    }
    return n;
  };

  /* ================================================================ Buffs */
  G.addBuff = (bf) => {
    const now = Date.now();
    const good = bf.mult >= 1;
    const dur = bf.dur * (good && !bf.fixed ? G.buffDur : 1);
    const ex = G.S.buffs.find((x) => x.id === bf.id && x.end > now);
    if (ex) {
      ex.end = Math.max(ex.end, now + dur * 1000);
      ex.dur = (ex.end - now) / 1000;
      ex.mult = Math.max(ex.mult, bf.mult);
    } else {
      G.S.buffs.push({ id: bf.id, name: bf.name, kind: bf.kind || 'prod', mult: bf.mult, end: now + dur * 1000, dur, icon: bf.icon || null });
    }
    G.recalc();
    DH.bus.emit('buff', bf);
  };
  G.hasBuff = (id) => G.S.buffs.some((b) => b.id === id && b.end > Date.now());
  G.clearBuffs = () => { G.S.buffs = []; G.recalc(); };

  /* ================================================================ Enten, Bugs, IRC, Quiz */
  G.duckEffect = (type) => {
    const S = G.S;
    const pow = G.duckPow;
    switch (type) {
      case 'lucky': {
        const v = (Math.max(Math.min(S.bytes * 0.15, G.bps * 900), G.bps * 60) + 13) * pow;
        earn(v);
        return { amount: v };
      }
      case 'frenzy':
        G.addBuff({ id: 'frenzy', name: 'Koffein-Rausch', kind: 'prod', mult: 7, dur: 77 * pow, icon: 'coffee' });
        return {};
      case 'clickfrenzy':
        G.addBuff({ id: 'clickfrenzy', name: 'Flow-Zustand', kind: 'click', mult: G.CF_MULT, dur: 13 * pow, icon: 'key' });
        return {};
      case 'special': {
        const cands = D.buildings.filter((b) => S.b[b.id] >= 10);
        if (!cands.length) return Object.assign(G.duckEffect('frenzy'), { fallback: 'frenzy' });
        const b = cands[Math.floor(Math.random() * cands.length)];
        const m = 1 + S.b[b.id] * 0.1;
        G.addBuff({ id: 'special', name: b.name + ' geht viral', kind: 'prod', mult: m, dur: 30 * pow, icon: b.id });
        return { building: b, mult: m };
      }
      default: return {};
    }
  };
  G.bugReward = () => Math.max(G.bpsBase * 15, (G.click / G.clickBuff) * 12, 5) * G.bugMult;
  G.lump = (sec) => Math.max(G.bpsBase * sec, (G.click / G.clickBuff) * Math.max(10, sec / 4), sec / 10 + 5);

  /* ================================================================ Hop (Prestige) */
  // Barthaare: im Log-Raum konkav -> früh großzügig, spät stark gedämpft
  G.hairsFor = (all) => {
    const x = Math.log10(Math.max(all, 1)) - G.HL0;
    if (x < 0) return 0;
    return Math.floor(Math.pow(10, G.HA * Math.pow(x, G.HB)) + 1e-9);
  };
  G.bytesForHairs = (h) => (h <= 1 ? Math.pow(10, G.HL0) : Math.pow(10, Math.pow(Math.log10(h) / G.HA, 1 / G.HB) + G.HL0));
  G.pendingHairs = () => Math.max(0, G.hairsFor(G.S.allBytes) - G.S.beardBase);
  G.hopGain = () => Math.floor(G.pendingHairs() * G.hopMult);
  G.canHop = () => G.pendingHairs() >= 1;
  // Freischaltung zählt den anstehenden Hop-Gewinn mit: „nach diesem Hop hast du genug Bart“
  G.distroUnlocked = (d) => (d.secret ? !!G.S.unlocked[d.id] || d.id === 'windows' : G.S.beard + G.hopGain() >= d.need);

  G.hop = (target) => {
    const S = G.S;
    const d = D.dIndex[target];
    if (!d || !G.distroUnlocked(d)) return false;
    const pend = G.pendingHairs();
    const gain = G.hopGain();
    const runSec = G.runSeconds();
    S.beardBase += pend;
    S.beard += gain;
    S.karma += gain;
    S.stats.hairsTotal += gain;
    S.stats.bestHop = Math.max(S.stats.bestHop, gain);
    if (gain > 0 && runSec < 600 && S.hops > 0) S.stats.fastHop = true;
    const prevB = Object.assign({}, S.b);
    const from = S.distro;
    S.lastRunB = prevB;
    S.hopLog = (S.hopLog || []).concat([{ n: S.hops + 1, from, to: target, gain, sec: Math.round(runSec), bytes: S.runBytes, t: Date.now() }]).slice(-12);
    // Reset
    S.bytes = 0; S.runBytes = 0; S.runClicks = 0; S.runStart = Date.now();
    D.buildings.forEach((b) => { S.b[b.id] = 0; });
    S.u = {}; S.choices = {}; S.buffs = S.buffs.filter((b) => b.id === 'daily' && b.end > Date.now());
    S.distro = target;
    S.visited[target] = (S.visited[target] || 0) + 1;
    S.hops++;
    G.recalc();
    // Startbonus
    const start = {};
    for (const id in S.dotfiles) {
      const e = (D.dfIndex[id] || {}).eff;
      if (e && e.start) for (const k in e.start) start[k] = (start[k] || 0) + e.start[k];
    }
    const keepFrac = G.keep + (d.special === 'nix' ? 0.15 : 0);
    if (keepFrac > 0) for (const k in prevB) start[k] = (start[k] || 0) + Math.floor(prevB[k] * keepFrac);
    for (const k in start) if (S.b[k] != null) S.b[k] += start[k];
    G.recalc();
    // Frische Installation: alles läuft flott
    G.addBuff({ id: 'fresh', name: 'Frisch installiert', kind: 'prod', mult: 2.5, dur: 180, fixed: true, icon: 'disc' });
    DH.bus.emit('hop', { from, to: target, gain });
    return gain;
  };

  G.buyDotfile = (id) => {
    const d = D.dfIndex[id];
    const S = G.S;
    if (!d || d.dir || S.dotfiles[id]) return false;
    if (!G.dotfileAvailable(d)) return false;
    if (S.karma < d.cost) return false;
    S.karma -= d.cost;
    S.dotfiles[id] = 1;
    G.recalc();
    DH.bus.emit('dotfile', d);
    return true;
  };
  G.dotfileAvailable = (d) => {
    let p = d.parent ? D.dfIndex[d.parent] : null;
    while (p) {
      if (!p.dir && !G.S.dotfiles[p.id]) return false;
      p = p.parent ? D.dfIndex[p.parent] : null;
    }
    return true;
  };

  /* ================================================================ Täglicher Bonus */
  // Einmal pro Kalendertag: Buff, der mit der Serie aufeinanderfolgender Tage wächst.
  G.dailyCheck = () => {
    const S = G.S;
    const d = new Date();
    const key = (x) => x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
    const today = key(d);
    if (S.daily.last === today) return null;
    const y = new Date(d); y.setDate(d.getDate() - 1);
    S.daily.streak = S.daily.last === key(y) ? S.daily.streak + 1 : 1;
    S.daily.best = Math.max(S.daily.best || 0, S.daily.streak);
    const first = !S.daily.last;
    S.daily.last = today;
    const mult = 1.5 + 0.1 * Math.min(S.daily.streak - 1, 15);
    if (!first) G.addBuff({ id: 'daily', name: 'Tägliches Update', kind: 'prod', mult, dur: 900, fixed: true, icon: 'box' });
    return { streak: S.daily.streak, mult, first };
  };

  /* ================================================================ Erfolge */
  G.checkAchievements = () => {
    const S = G.S;
    const fresh = [];
    for (const a of D.achievements) {
      if (S.ach[a.id]) continue;
      let ok = false;
      try { ok = a.check(S, G); } catch (e) { ok = false; }
      if (ok) { S.ach[a.id] = Date.now(); fresh.push(a); }
    }
    if (fresh.length) {
      G.recalc();
      fresh.forEach((a) => DH.bus.emit('achievement', a));
    }
    return fresh;
  };
  G.secret = (id) => {
    if (G.S.secrets[id]) return false;
    G.S.secrets[id] = Date.now();
    G.checkAchievements();
    return true;
  };

  /* ================================================================ Auto-Kauf */
  G.autoBuy = () => {
    const S = G.S;
    let did = false;
    if (G.flags.autoUpg && S.settings.autoUpg) {
      if (G.buyAllUpgrades() > 0) did = true;
    }
    if (G.flags.autoBld && S.settings.autoBld) {
      for (let i = 0; i < 60; i++) {
        let best = null, bestP = Infinity;
        for (const b of D.buildings) {
          if (!G.revealed(b)) continue;
          const gain = G.perUnit[b.id] * G.prodMult;
          const p = G.bCost(b.id) / Math.max(gain, 1e-12);
          if (p < bestP) { bestP = p; best = b; }
        }
        let pick = null, pickP = Infinity;
        for (const b of D.buildings) {
          if (!G.revealed(b)) continue;
          const c = G.bCost(b.id);
          if (c > S.bytes) continue;
          const p = c / Math.max(G.perUnit[b.id] * G.prodMult, 1e-12);
          if (p <= bestP * 1.6 && p < pickP) { pickP = p; pick = b; }
        }
        if (!pick) break;
        G.buyBuilding(pick.id, 1);
        did = true;
      }
    }
    return did;
  };

  /* ================================================================ Tick */
  let feeTimer = 0, recalcTimer = 0;
  G.tick = (dt) => {
    const S = G.S;
    if (!(dt > 0)) return;
    S.stats.playTime += dt;
    // Buffs ablaufen lassen
    const now = Date.now();
    if (S.buffs.length) {
      const before = S.buffs.length;
      const ended = S.buffs.filter((b) => b.end <= now);
      if (ended.length) {
        S.buffs = S.buffs.filter((b) => b.end > now);
        G.recalc();
        ended.forEach((b) => DH.bus.emit('buffEnd', b));
      } else if (before) { /* nichts */ }
    }
    // Gentoo: zeitabhängig
    recalcTimer += dt;
    if (recalcTimer >= 2) { recalcTimer = 0; if (G.distro().special === 'gentoo') G.recalc(); }
    earn(G.bps * dt);
    if (G.bpsBase > S.stats.maxBps) S.stats.maxBps = G.bpsBase;
    // RHEL-Abo
    if (G.distro().special === 'subscription') {
      feeTimer += dt;
      if (feeTimer >= 60) {
        feeTimer = 0;
        const fee = Math.min(S.bytes * 0.01, G.bpsBase * 30);
        if (fee > 0) { S.bytes -= fee; DH.bus.emit('fee', fee); }
      }
    }
  };

  // Offline-Ertrag berechnen (ohne Buffs)
  G.offlineGain = (sec) => {
    const capped = Math.min(sec, G.offlineCap * 3600);
    const saved = G.S.buffs; G.S.buffs = []; G.recalc();
    const v = G.bpsBase * capped * G.offlineEff;
    G.S.buffs = saved; G.recalc();
    return { gain: v, capped, eff: G.offlineEff };
  };
})();
