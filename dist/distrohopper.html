    mel.forEach((f, i) => { tone(s, f, dur[i], 'square', 0.07); tone(s, f / 2, dur[i], 'triangle', 0.07); s += dur[i] * 0.9; });
  };
  A.train = () => {
    if (!ok()) return;
    const t = A.ctx.currentTime;
    for (let i = 0; i < 16; i++) noiseBurst(t + i * 0.22, 0.12, 'lowpass', 500, 1, 0.3);
    tone(t, 740, 0.5, 'sawtooth', 0.04); tone(t, 880, 0.5, 'sawtooth', 0.04);
    tone(t + 2.2, 740, 0.6, 'sawtooth', 0.04); tone(t + 2.2, 880, 0.6, 'sawtooth', 0.04);
  };
  /* ---------- Prozedurale Chiptune-Musik (pro Distro eigene Variation) ---------- */
  const SCALES = { minor: [0, 2, 3, 5, 7, 8, 10], major: [0, 2, 4, 5, 7, 9, 11], dorian: [0, 2, 3, 5, 7, 9, 10], phrygian: [0, 1, 3, 5, 7, 8, 10], mixo: [0, 2, 4, 5, 7, 9, 10] };
  const SONGS = {
    ubuntu: { bpm: 108, root: 57, scale: 'minor', prog: [0, 5, 2, 6] },
    mint: { bpm: 100, root: 60, scale: 'major', prog: [0, 4, 5, 3] },
    fedora: { bpm: 116, root: 62, scale: 'dorian', prog: [0, 3, 0, 4] },
    debian: { bpm: 90, root: 55, scale: 'minor', prog: [0, 3, 4, 0], calm: true },
    arch: { bpm: 134, root: 52, scale: 'minor', prog: [0, 5, 6, 4], drive: true },
    manjaro: { bpm: 104, root: 59, scale: 'dorian', prog: [0, 6, 3, 4] },
    opensuse: { bpm: 112, root: 60, scale: 'mixo', prog: [0, 6, 3, 0] },
    popos: { bpm: 122, root: 61, scale: 'major', prog: [0, 5, 3, 4], drive: true },
    kali: { bpm: 128, root: 50, scale: 'phrygian', prog: [0, 1, 0, 6], drive: true },
    gentoo: { bpm: 110, root: 54, scale: 'dorian', prog: [0, 2, 3, 4] },
    alpine: { bpm: 96, root: 64, scale: 'major', prog: [0, 3, 4, 3], calm: true },
    nixos: { bpm: 118, root: 58, scale: 'mixo', prog: [0, 4, 6, 3] },
    slackware: { bpm: 88, root: 52, scale: 'minor', prog: [0, 3, 0, 4], calm: true },
    void: { bpm: 100, root: 49, scale: 'phrygian', prog: [0, 1, 5, 6] },
    cachyos: { bpm: 140, root: 57, scale: 'minor', prog: [0, 5, 3, 6], drive: true },
    rhel: { bpm: 106, root: 55, scale: 'major', prog: [0, 3, 4, 4] },
    freebsd: { bpm: 114, root: 53, scale: 'dorian', prog: [0, 6, 5, 6] },
    lfs: { bpm: 98, root: 56, scale: 'minor', prog: [0, 2, 5, 4] },
    hannah: { bpm: 126, root: 64, scale: 'major', prog: [0, 5, 3, 4], drive: true },
    windows: { bpm: 84, root: 58, scale: 'major', prog: [0, 4, 3, 4], calm: true },
  };
  const M = A.music = { on: false, vol: 0.4, gain: null, timer: null, step: 0, bar: 0, next: 0, song: SONGS.ubuntu, pending: null, seed: 1 };
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
  function rnd(n) { M.seed = (M.seed * 16807) % 2147483647; return (M.seed % 1000) / 1000 * n; }
  function mTone(t, freq, dur, type, gain, slide) {
    const o = A.ctx.createOscillator();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    const g = A.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(M.gain);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function mNoise(t, dur, freq, gain) {
    const src = A.ctx.createBufferSource(); src.buffer = A.noise;
    const f = A.ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = freq;
    const g = A.ctx.createGain();
    g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(M.gain);
    src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.02);
  }
  function chord(song, deg) {
    const sc = SCALES[song.scale];
    const note = (d) => song.root + sc[((d % 7) + 7) % 7] + 12 * Math.floor(d / 7);
    return [note(deg), note(deg + 2), note(deg + 4), note(deg + 7)];
  }
  function scheduleStep(t) {
    const s = M.song, st = M.step % 16;
    if (st === 0) {
      if (M.pending) { M.song = M.pending; M.pending = null; }
      M.bar++;
      M.seed = 1000 + (M.bar % 8) * 97 + s.root;
    }
    const c = chord(M.song, M.song.prog[Math.floor(M.step / 16) % M.song.prog.length]);
    const spb = 60 / M.song.bpm / 4;
    // Schlagzeug
    if (st % 8 === 0 || (M.song.drive && st % 4 === 0)) mTone(t, 150, 0.16, 'sine', 0.5, 45);
    if (st === 4 || st === 12) mNoise(t, M.song.calm ? 0.08 : 0.13, 1800, M.song.calm ? 0.12 : 0.22);
    if (st % 2 === 1 && !M.song.calm) mNoise(t, 0.03, 7000, 0.06);
    // Bass
    if ([0, 3, 6, 8, 11, 14].includes(st) && (!M.song.calm || st % 8 === 0)) mTone(t, mtof(c[0] - 12 + (st === 11 ? 12 : 0)), spb * (st % 8 === 0 ? 2.5 : 1.5), 'triangle', 0.28);
    // Arpeggio
    const arp = [0, 1, 2, 3, 2, 1, 0, 2][st % 8];
    if (!M.song.calm || st % 2 === 0) mTone(t, mtof(c[arp] + 12), spb * 0.9, 'square', 0.045);
    // Melodie (leicht zufällig, aber pro Takt reproduzierbar)
    if ((st === 0 || st === 6 || st === 10 || (st === 14 && rnd(1) > 0.5)) && M.bar % 4 !== 3) {
      const sc = SCALES[M.song.scale];
      const deg = Math.floor(rnd(7));
      mTone(t, mtof(M.song.root + 12 + sc[deg]), spb * (st === 0 ? 3 : 2), 'square', 0.06);
    }
    M.step++;
  }
  function tick() {
    if (!A.ctx || !M.on) return;
    while (M.next < A.ctx.currentTime + 0.25) {
      if (M.next < A.ctx.currentTime - 0.1) M.next = A.ctx.currentTime + 0.05;
      scheduleStep(M.next);
      M.next += 60 / M.song.bpm / 4;
    }
  }
  A.musicSet = (on) => {
    M.on = on;
    if (!A.ctx) return;
    if (!M.gain) { M.gain = A.ctx.createGain(); M.gain.gain.value = M.vol; M.gain.connect(A.master); }
    if (on && !M.timer) { M.next = A.ctx.currentTime + 0.1; M.step = 0; M.timer = setInterval(tick, 50); }
    if (!on && M.timer) { clearInterval(M.timer); M.timer = null; }
  };
  A.musicVolume = (v) => { M.vol = v; if (M.gain) M.gain.gain.setTargetAtTime(v, A.ctx.currentTime, 0.05); };
  A.musicSong = (id) => { const s = SONGS[id] || SONGS.ubuntu; if (M.on) M.pending = s; else M.song = s; };

  A.windowsUpdate = () => {
    if (!ok()) return;
    const t = A.ctx.currentTime;
    [523, 784, 659, 1047].forEach((f, i) => tone(t + i * 0.15, f, 0.5, 'sine', 0.06, null, 0.03));
  };
})();

/* ---- js/fx.js ---- */
'use strict';
/* DistroHopper – Effekte: Partikel, schwebende Zahlen, Konfetti, Matrix-Regen */
(function () {
  const FX = DH.fx = { enabled: true, shake: true };
  let cv, ctx, W = 0, H = 0, dpr = 1;
  const parts = [];
  const texts = [];
  let matrix = null;
  const MAX_PARTS = 420;

  FX.init = () => {
    cv = document.getElementById('fx');
    ctx = cv.getContext('2d');
    resize();
    window.addEventListener('resize', resize);
  };
  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
  }

  const BIT_COLORS = ['#7ee787', '#a5d6ff', '#ffd166', '#f0f6fc'];

  // Bits (0/1), die aus dem Klickpunkt spritzen
  FX.bits = (x, y, n = 6, color) => {
    if (!FX.enabled) return;
    for (let i = 0; i < n && parts.length < MAX_PARTS; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 60 + Math.random() * 180;
      parts.push({
        type: 'bit', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120, g: 420,
        life: 0, max: 0.6 + Math.random() * 0.5, ch: Math.random() < 0.5 ? '0' : '1',
        color: color || BIT_COLORS[(Math.random() * BIT_COLORS.length) | 0], size: 14 + Math.random() * 8, rot: 0, vr: 0,
      });
    }
  };
  FX.sparks = (x, y, n = 14, color = '#ffd23f') => {
    if (!FX.enabled) return;
    for (let i = 0; i < n && parts.length < MAX_PARTS; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 80 + Math.random() * 260;
      parts.push({ type: 'spark', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: 200, life: 0, max: 0.4 + Math.random() * 0.5, color, size: 2 + Math.random() * 3 });
    }
  };
  FX.confetti = (n = 160, fromX, fromY) => {
    if (!FX.enabled) return;
    const cols = ['#ff5f6d', '#ffd166', '#5ee08f', '#5ce1e6', '#a86fff', '#ff8fc7', '#ffffff'];
    for (let i = 0; i < n && parts.length < MAX_PARTS; i++) {
      const x = fromX != null ? fromX : Math.random() * W;
      const y = fromY != null ? fromY : -20 - Math.random() * H * 0.3;
      const a = fromX != null ? Math.random() * Math.PI * 2 : Math.PI / 2;
      const sp = fromX != null ? 150 + Math.random() * 350 : 40 + Math.random() * 120;
      parts.push({
        type: 'conf', x, y, vx: Math.cos(a) * sp + (Math.random() - 0.5) * 60, vy: Math.sin(a) * sp, g: 160, drag: 0.985,
        life: 0, max: 2.5 + Math.random() * 2, color: cols[(Math.random() * cols.length) | 0], w: 6 + Math.random() * 6, h: 3 + Math.random() * 4,
        rot: Math.random() * 6, vr: (Math.random() - 0.5) * 12,
      });
    }
  };
  // Schwebender Text (+123 B)
  FX.text = (x, y, str, color = '#ffd166', size = 22, opts = {}) => {
    if (texts.length > 60) texts.shift();
    texts.push({ x: x + (Math.random() - 0.5) * 24, y, str, color, size, life: 0, max: opts.max || 1.1, vy: opts.vy || -70, big: !!opts.big });
  };

  FX.shakeEl = (el, cls = 'shake') => {
    if (!FX.shake || !el) return;
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  };

  // Matrix-Regen für n Sekunden
  FX.matrix = (sec = 8) => {
    const cols = Math.ceil(W / 16);
    matrix = { t: 0, max: sec, drops: Array.from({ length: cols }, () => Math.random() * -H / 16), speed: Array.from({ length: cols }, () => 8 + Math.random() * 14) };
  };

  FX.busy = () => parts.length > 0 || texts.length > 0 || !!matrix;

  const MX = 'アイウエオカキクケコサシスセソ01010110ﾊﾋﾌﾍﾎ$#@%&TUXBASHSUDO';

  FX.frame = (dt) => {
    if (!ctx) return;
    if (!parts.length && !texts.length && !matrix) {
      if (cv._dirty) { ctx.clearRect(0, 0, cv.width, cv.height); cv._dirty = false; }
      return;
    }
    cv._dirty = true;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    if (matrix) {
      matrix.t += dt;
      const fade = matrix.t > matrix.max - 1 ? Math.max(0, matrix.max - matrix.t) : Math.min(1, matrix.t * 2);
      ctx.fillStyle = `rgba(0,0,0,${0.55 * fade})`;
      ctx.fillRect(0, 0, W, H);
      ctx.font = '16px VT323, monospace';
      for (let i = 0; i < matrix.drops.length; i++) {
        const y = matrix.drops[i] * 16;
        for (let k = 0; k < 14; k++) {
          const yy = y - k * 16;
          if (yy < -16 || yy > H) continue;
          const ch = MX[(Math.random() * MX.length) | 0];
          ctx.fillStyle = k === 0 ? `rgba(220,255,220,${fade})` : `rgba(0,255,70,${fade * (1 - k / 14)})`;
          ctx.fillText(ch, i * 16, yy);
        }
        matrix.drops[i] += matrix.speed[i] * dt;
        if (matrix.drops[i] * 16 > H + 240) matrix.drops[i] = Math.random() * -10;
      }
      if (matrix.t >= matrix.max) matrix = null;
    }

    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life += dt;
      if (p.life >= p.max) { parts.splice(i, 1); continue; }
      if (p.drag) { p.vx *= p.drag; p.vy *= p.drag; }
      p.vy += (p.g || 0) * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      const a = 1 - p.life / p.max;
      if (p.type === 'bit') {
        ctx.globalAlpha = a;
        ctx.fillStyle = p.color;
        ctx.font = `${p.size}px VT323, monospace`;
        ctx.fillText(p.ch, p.x, p.y);
      } else if (p.type === 'spark') {
        ctx.globalAlpha = a;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
      } else if (p.type === 'conf') {
        p.rot += p.vr * dt;
        ctx.globalAlpha = Math.min(1, a * 2);
        ctx.save();
        ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.rot * 1.7)));
        ctx.restore();
      }
    }
    ctx.globalAlpha = 1;

    for (let i = texts.length - 1; i >= 0; i--) {
      const t = texts[i];
      t.life += dt;
      if (t.life >= t.max) { texts.splice(i, 1); continue; }
      t.y += t.vy * dt;
      const k = t.life / t.max;
      const a = k < 0.7 ? 1 : 1 - (k - 0.7) / 0.3;
      const pop = t.big ? 1 + Math.max(0, 0.35 - t.life) * 1.5 : 1 + Math.max(0, 0.12 - t.life) * 3;
      ctx.globalAlpha = a;
      ctx.font = `${Math.round(t.size * pop)}px VT323, monospace`;
      ctx.textAlign = 'center';
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(0,0,0,.65)';
      ctx.strokeText(t.str, t.x, t.y);
      ctx.fillStyle = t.color;
      ctx.fillText(t.str, t.x, t.y);
      ctx.textAlign = 'start';
    }
    ctx.globalAlpha = 1;
  };
})();

/* ---- js/terminal.js ---- */
'use strict';
/* DistroHopper – Das CRT-Terminal: Hackertyper-Stream + eingeschobene Systemzeilen */
(function () {
  const T = DH.term = {};
  const MAX_LINES = 70;
  let box, cur = null, segs = [], segIdx = 0, segPos = 0, codeIdx = 0, cursor;
  let order = [];

  T.init = () => {
    box = document.getElementById('crt-lines');
    cursor = document.createElement('span');
    cursor.className = 'cursor';
    order = shuffledOrder();
    newLine();
  };

  // Code-Stream in Blöcken mischen, damit nicht jeder Run gleich aussieht
  function shuffledOrder() {
    const code = DH.content.code;
    const blocks = [];
    let blk = [];
    code.forEach((l, i) => {
      blk.push(i);
      const next = code[i + 1];
      if (next === undefined || (next.startsWith('$ ') && blk.length > 2) || (l === '' && blk.length > 2)) { blocks.push(blk); blk = []; }
    });
    if (blk.length) blocks.push(blk);
    return DH.util.shuffle(blocks).flat();
  }

  function ps1() {
    const d = DH.game.distro();
    // starship.toml-Dotfile: schicker Prompt im Stil von Oh My Zsh
    if (DH.game.flags && DH.game.flags.prompt) return '➜ ' + d.user + ' ~ git:(main) ✗';
    return d.user + '@' + d.id + ':~$';
  }
  T.ps1 = ps1;

  function parse(line) {
    if (line.startsWith('$ ')) return [{ t: ps1() + ' ', c: 'ps', instant: true }, { t: line.slice(2), c: 'cmd' }];
    let m;
    if ((m = line.match(/^(\[\s*OK\s*\])(.*)$/))) return [{ t: m[1], c: 'ok' }, { t: m[2], c: '' }];
    if ((m = line.match(/^(\[(FAILED| WARN )\])(.*)$/))) return [{ t: m[1], c: m[2] === 'FAILED' ? 'err' : 'warn' }, { t: m[3], c: '' }];
    if (/^\s*(#(?!include|!)|\/\/|--|;|\(gdb\))/.test(line)) return [{ t: line, c: 'dim' }];
    if (/(error|Fehler|fehler|rejected|denied|CrashLoop|vulnerabilities|Speicherzugriffsfehler)/.test(line)) return [{ t: line, c: 'err' }];
    if (/(warning|warn:)/i.test(line)) return [{ t: line, c: 'warn' }];
    if (/^\s*(#include|#!\/)/.test(line)) return [{ t: line, c: 'kw' }];
    return [{ t: line, c: '' }];
  }

  function newLine() {
    const code = DH.content.code;
    if (codeIdx >= order.length) { codeIdx = 0; order = shuffledOrder(); }
    const text = code[order[codeIdx++]];
    const el = document.createElement('div');
    el.className = 'ln';
    segs = parse(text).map((s) => {
      const sp = document.createElement('span');
      if (s.c) sp.className = 't-' + s.c;
      el.appendChild(sp);
      return { t: s.t, sp, node: null, instant: s.instant };
    });
    segIdx = 0; segPos = 0;
    // sofort sichtbare Segmente (Prompt)
    while (segIdx < segs.length && segs[segIdx].instant) { segs[segIdx].sp.textContent = segs[segIdx].t; segIdx++; }
    el.appendChild(cursor);
    box.appendChild(el);
    cur = el;
    trim();
    if (segIdx >= segs.length || segs.every((s) => !s.t.length)) { /* leere Zeile */ }
  }

  function trim() {
    while (box.childElementCount > MAX_LINES) box.removeChild(box.firstElementChild);
  }

  // n Zeichen tippen
  T.type = (n) => {
    let guard = 0;
    while (n > 0 && guard++ < 400) {
      if (segIdx >= segs.length) { newLine(); continue; }
      const s = segs[segIdx];
      if (!s.node) { s.node = document.createTextNode(''); s.sp.appendChild(s.node); }
      const rest = s.t.length - segPos;
      if (rest <= 0) { segIdx++; segPos = 0; if (segIdx >= segs.length) { newLine(); n--; } continue; }
      const k = Math.min(rest, n);
      s.node.appendData(s.t.substr(segPos, k));
      segPos += k; n -= k;
      if (segPos >= s.t.length) { segIdx++; segPos = 0; }
    }
    if (segIdx >= segs.length) newLine();
  };

  // Fertige Zeile vor der aktuellen Tippzeile einschieben
  T.println = (text, cls, html) => {
    if (!box) return;
    const el = document.createElement('div');
    el.className = 'ln' + (cls ? ' ' + cls.split(' ').map((c) => 't-' + c).join(' ') : '');
    if (html) el.innerHTML = text; else el.textContent = text;
    box.insertBefore(el, cur);
    trim();
    return el;
  };
  T.cmd = (cmd) => {
    const el = document.createElement('div');
    el.className = 'ln';
    const p = document.createElement('span'); p.className = 't-ps'; p.textContent = ps1() + ' ';
    const c = document.createElement('span'); c.className = 't-cmd'; c.textContent = cmd;
    el.append(p, c);
    box.insertBefore(el, cur);
    trim();
  };
  // Alles leeren und frisch mit neuer Tippzeile beginnen (z. B. nach dem Hop)
  T.reset = () => {
    if (!box) return;
    box.innerHTML = '';
    newLine();
  };
  T.clear = () => {
    if (!box) return;
    while (box.firstElementChild && box.firstElementChild !== cur) box.removeChild(box.firstElementChild);
  };

  // Paket-Installation im Distro-Stil anzeigen
  T.install = (bid, n) => {
    const d = DH.game.distro();
    const pkg = DH.content.pkg[bid] || bid;
    const names = n > 1 ? pkg + ' (×' + n + ')' : pkg;
    if (d.id === 'windows') {
      T.println('Microsoft Store wird geöffnet … Anmeldung erforderlich … ' + names + ' installiert.', 'dim');
      return;
    }
    if (d.id === 'lfs') {
      T.cmd('cd ' + pkg + '-src && ./configure && make -j$(nproc) && make install');
      return;
    }
    T.cmd(d.pm + ' ' + pkg);
    const lines = {
      apt: 'Richte ' + names + ' ein …',
      pacman: '(1/1) Installiere ' + names + '              [####################] 100%',
      dnf: 'Installiert: ' + names + '  Komplett!',
      zypper: '(1/1) Installiere: ' + names + ' ............[fertig]',
      emerge: '>>> Emerging (1 of 1) dev-nerd/' + names + ' … kompiliert in 3 h 12 min',
      nix: 'installing \'' + names + '\' → /nix/store/' + Math.random().toString(36).slice(2, 10) + '-' + pkg,
      apk: '(1/1) Installing ' + names + ' … OK: 5 MiB in 1 packages',
      xbps: names + ': installed successfully.',
      pkg: 'Installing ' + names + ' … done',
      installpkg: 'Installing package ' + names + '.txz … PACKAGE DESCRIPTION: ' + pkg,
      pamac: 'Transaktion erfolgreich abgeschlossen: ' + names,
      winget: names + ' erfolgreich installiert',
    };
    const key = d.pm.includes('apt') ? 'apt' : d.pm.includes('pacman') ? 'pacman' : d.pm.includes('dnf') ? 'dnf' : d.pm.includes('zypper') ? 'zypper'
      : d.pm.includes('emerge') ? 'emerge' : d.pm.includes('nix') ? 'nix' : d.pm.includes('apk') ? 'apk' : d.pm.includes('xbps') ? 'xbps'
        : d.pm.includes('installpkg') ? 'installpkg' : d.pm.includes('pamac') ? 'pamac' : d.pm.includes('pkg') ? 'pkg' : 'apt';
    T.println(lines[key], 'dim');
  };

  T.neofetch = () => {

  };

/* ---- js/shell.js ---- */
'use strict';
/* DistroHopper – Mini-Shell mit Easter Eggs */
(function () {
  const SH = DH.shell = { history: [], hIdx: -1, mode: 'sh', vimFails: 0 };
  const T = () => DH.term;
  const out = (t, c) => T().println(t, c);
  const outH = (h, c) => T().println(h, c, true);
  const G = () => DH.game;

  const PM = ['apt', 'apt-get', 'pacman', 'dnf', 'yum', 'zypper', 'emerge', 'nix-env', 'nix', 'apk', 'xbps-install', 'pkg', 'yay', 'paru', 'pamac', 'snap', 'flatpak', 'winget', 'brew', 'installpkg'];
  const CMDS = ['help', 'clear', 'ls', 'cat', 'cd', 'pwd', 'whoami', 'uname', 'uptime', 'neofetch', 'fastfetch', 'sudo', 'cowsay', 'fortune', 'vim', 'nano', 'emacs', 'exit',
    'history', 'echo', 'date', 'cal', 'ping', 'top', 'htop', 'systemctl', 'man', 'git', 'matrix', 'hack', 'tux', 'lolcat', 'df', 'free', 'ssh', 'reboot', 'save', 'stats', 'lsb_release', 'hop', 'curl', 'rm', 'sl', 'make', 'xyzzy', 'quack'];

  SH.complete = (s) => {
    const parts = s.split(' ');
    if (parts.length > 1) {
      const files = ['todo.txt', 'README.md', 'witze.txt', '.bashrc', '/etc/os-release'];
      const last = parts[parts.length - 1];
      const m = files.filter((f) => f.startsWith(last));
      if (m.length === 1) { parts[parts.length - 1] = m[0]; return parts.join(' '); }
      return s;
    }
    const m = CMDS.filter((c) => c.startsWith(s));
    if (m.length === 1) return m[0] + ' ';
    if (m.length > 1) out(m.join('  '), 'dim');
    return s;
  };

  function prompt() { return T().ps1(); }

  SH.promptText = () => (SH.mode === 'vim' ? ':' : prompt());

  SH.run = (raw) => {
    const input = raw.trim();
    if (SH.mode === 'vim') return vim(input);
    T().cmd(input);
    if (!input) return;
    SH.history.push(input);
    if (SH.history.length > 50) SH.history.shift();
    SH.hIdx = -1;
    exec(input);
  };

  function exec(input) {
    const S = G().S, U = DH.util, d = G().distro();
    const low = input.toLowerCase().replace(/\s+/g, ' ');
    const [cmd, ...args] = input.split(/\s+/);
    const a = args.join(' ');
    const c = cmd.toLowerCase();

    // ---- Spezialfälle zuerst
    if (/^sudo make me a sandwich$/.test(low)) { out('Okay.', 'ok'); secret('sandwich'); return; }
    if (/^make me a sandwich$/.test(low)) { out('Mach es doch selbst.', 'err'); return; }
    if (/^sudo rm -rf \/ --no-preserve-root/.test(low) || /^sudo rm -rf --no-preserve-root \//.test(low)) { return nuke(); }
    if (/^(sudo )?rm -rf \/(\*)?$/.test(low) || /^(sudo )?rm -rf \/ /.test(low)) {
      out('rm: Es ist gefährlich, rekursiv auf „/“ zu arbeiten.', 'err');
      out('rm: Benutzen Sie --no-preserve-root, um diese Sicherheitsmaßnahme zu umgehen.', 'err');
      secret('rmrf'); return;
    }
    if (/hannah.?montana/.test(low) && (/install|-s |add|emerge|-ia/.test(low))) return hannah();
    if (/^(sudo )?(give|gib) (me|mir) (bytes|geld|money)|^(motherlode|rosebud|iddqd|idkfa|kaching)$/.test(low)) {
      out(c === 'iddqd' ? 'God Mode aktiviert. (Nicht wirklich.)' : 'Schummler! Na gut, hier ist 1 Byte.', 'warn');
      G().earn(1); secret('cheat'); return;
    }
    if (/^(42|was ist die antwort.*|what is the answer.*|the answer)$/.test(low) || /leben.*universum/.test(low)) {
      out('42.', 'ok'); out('Aber was war nochmal die Frage?', 'dim'); secret('answer'); return;
    }
    if (/^(make )?(coffee|kaffee)|^brew (coffee|kaffee)|^teapot/.test(low)) {
      out('HTTP/1.1 418 I’m a teapot', 'warn'); out('Dieses Terminal kann keinen Kaffee kochen. Es ist eine Teekanne.', 'dim'); secret('teapot'); return;
    }
    if (/^(typewriter|schreibmaschine)$/.test(low)) {
      out('Klack-klack-klack … *ding*', 'ok'); out('Tastatur-Sound „Schreibmaschine“ freigeschaltet (System → Optionen).', 'dim'); secret('typewriter'); return;
    }
    if (low === 'git push --force' || low === 'git push -f' || /git push .*(--force|-f).*main/.test(low)) {
      out('To github.com:du/produktion.git', 'dim'); out(' + a1b2c3d...0000000 main -> main (forced update)', 'warn');
      out('Das hast du nicht wirklich getan. Die Kollegen sind informiert.', 'err'); secret('forcepush'); return;
    }

    switch (c) {
      case 'help': case 'hilfe': case '?':
        out('DistroHopper-Shell – verfügbare Befehle:', 'ok');
        out('  help  clear  ls  cat  cd  pwd  whoami  uname  uptime  neofetch', '');
        out('  top  systemctl  history  echo  date  cal  ping  man  git  df  free', '');
        out('  cowsay  fortune  tux  lolcat  save  stats  exit', '');
        out('…und ein paar Befehle, die hier nicht stehen. Probier ruhig herum.', 'dim');
        return;
      case 'clear': case 'reset': T().clear(); return;
      case 'cls': out('Das ist kein DOS. Aber gut, ausnahmsweise.', 'dim'); setTimeout(() => T().clear(), 600); return;
      case 'dir': out('Das ist kein DOS. Trotzdem:', 'dim'); // fallthrough
      case 'ls': case 'll': case 'la': {
        const all = /a/.test(a) || c === 'la' || c === 'll';
        const f = ['Dokumente/', 'Downloads/', 'isos/', 'memes/', 'node_modules/', 'README.md', 'todo.txt', 'witze.txt', 'wirklich_final_v3_FINAL.odt'];
        if (all) f.unshift('.', '..', '.bashrc', '.config/', '.dotfiles.git/', '.ssh/', '.bartoel');
        outH(f.map((x) => (x.endsWith('/') ? `<span class="t-kw">${x}</span>` : x)).join('  '));
        return;
      }
      case 'cd':
        if (!a || a === '~') return;
        if (a === '..' || a === '/') { out('Du hast keine Berechtigung, dein Zuhause zu verlassen.', 'dim'); return; }
        out('cd: ' + a + ': Du bist schon da, wo du hin willst. Im Herzen.', 'dim');
        return;
      case 'pwd': out('/home/' + d.user); return;
      case 'whoami': out(d.user + ' – ein Mensch, der sein OS öfter wechselt als seine Socken.'); return;
      case 'uname':
        out(/a/.test(a) ? `Linux ${d.id} 6.${S.hops % 20}.0-distrohopper #1 SMP PREEMPT_DYNAMIC x86_64 GNU/Linux` : 'Linux');
        return;
      case 'uptime': out(`up ${U.dur(G().runSeconds())} seit dem letzten Hop, insgesamt ${U.dur(S.stats.playTime)} gespielt, load average: ${(Math.random() * 4).toFixed(2)}`); return;
      case 'neofetch': case 'fastfetch': case 'screenfetch': T().neofetch(); secret('neofetch'); return;
      case 'lsb_release': out('Distributor ID: ' + d.name); out('Description:    ' + d.name + ' – ' + d.tag); return;
      case 'cat': return cat(a);
      case 'sudo': return sudo(a);
      case 'sl': return sl();
      case 'cowsay': return cowsay(a || 'Muuuh. Ich bin eine Kuh in einem Terminal.');
      case 'fortune': out(U.pick(DH.content.fortunes), 'kw'); secret('fortune'); return;
      case 'vim': case 'vi': case 'nvim': return vimStart();
      case 'nano': out('GNU nano – endlich ein Editor für Menschen. Leider gibt es hier nichts zu bearbeiten.', 'dim'); return;
      case 'emacs':
        out('Starte Emacs …', 'dim'); out('Lade Betriebssystem … Lade Mail-Client … Lade Tetris … Lade Psychotherapeut (M-x doctor) …', 'dim');
        out('Emacs benötigt für die Bedienung 3 weitere Finger. Abgebrochen.', 'warn'); secret('emacs'); return;
      case 'exit': case 'logout': case 'quit':
        out('Hier gibt es kein Entkommen. …Na gut.', 'dim'); setTimeout(() => DH.ui.closeShell(), 500); return;
      case 'history': SH.history.slice(-15).forEach((h, i) => out(String(SH.history.length - Math.min(15, SH.history.length) + i + 1).padStart(4) + '  ' + h, 'dim')); return;
      case 'echo': out(a.replace(/\$USER/g, d.user).replace(/\$SHELL/g, '/usr/bin/fish').replace(/^["']|["']$/g, '')); return;
      case 'date': out(new Date().toLocaleString('de-DE', { dateStyle: 'full', timeStyle: 'medium' })); return;
      case 'cal': return cal();
      case 'ping': return ping(a || 'localhost');
      case 'top': case 'htop': case 'btop': return top();
      case 'systemctl': return systemctl();
      case 'man': out(a ? `Keine Handbuchseite für „${a}“. Versuch’s mit dem Arch-Wiki.` : 'Welche Handbuchseite möchten Sie?', 'dim'); return;
      case 'git': return git(a);
      case 'matrix': case 'cmatrix': DH.fx.matrix(8); out('Wach auf, Neo …', 'ok'); secret('matrix'); return;
      case 'hack': case 'hollywood': case 'hacker': return hack();
      case 'tux': DH.content.tuxAscii.forEach((l) => out(l, 'art')); out('  Das bin ich!', 'ok'); return;
      case 'lolcat': return lolcat(a || 'Regenbogen macht alles schneller!');
      case 'df': out('Dateisystem   Größe  Benutzt  Verf.  Verw%  Eingehängt auf'); out('/dev/nvme0n1p2  931G    930G     1G   99%  /', 'warn'); out('# Wahrscheinlich die ISOs.', 'dim'); return;
      case 'free': out('Speicher: gesamt 7,6Gi · benutzt 7,5Gi (Chrome: 7,4Gi)', 'warn'); return;
      case 'ssh': out('ssh: connect to host ' + (a || 'localhost') + ' port 22: Permission denied (publickey).', 'err'); return;
      case 'reboot': case 'shutdown': case 'poweroff': case 'halt': return reboot();
      case 'save': G().save(); out('Spielstand gespeichert.', 'ok'); return;
      case 'stats': out(`Bytes: ${U.bytes(S.bytes)} · Rate: ${U.rate(G().bps)} · Klicks: ${U.num(S.stats.clicks)} · Bart: ${U.num(S.beard)} · Hops: ${S.hops}`); return;
      case 'hop': case 'distro': out('Zum Distro-Wechseln: Tab „Hop“ öffnen. GRUB wartet schon.', 'dim'); return;
      case 'curl': case 'wget':
        if (/wttr/.test(a)) { out('Wetterbericht: Überall', 'ok'); out('   ☁  Bewölkt mit Aussicht auf Kernel-Panic, 13 °C'); return; }
        out('curl: (6) Konnte Host nicht auflösen. Es ist immer DNS.', 'err'); return;
      case 'rm': out('rm: Nö.', 'err'); return;
      case 'xyzzy': out('Nichts passiert.', 'dim'); secret('xyzzy'); return;
      case 'plugh': out('Eine hohle Stimme sagt „Narr“.', 'dim'); return;
      case 'quack': case 'duck': out('    __', 'kw'); out('___( o)>  Quack!', 'kw'); out('\\ <_. )', 'kw'); out(' `---\'', 'kw'); return;
      case 'hello': case 'hallo': case 'hi': case 'moin': case 'servus': out(DH.util.pick(['Hallo! Schön, dass du da bist.', 'Moin!', 'Servus! Schon was kompiliert heute?', 'Hallo Welt! …Entschuldigung, alte Gewohnheit.'])); return;
      case 'linux': out('Was du als Linux bezeichnest, heißt eigentlich GNU/Linux – oder, wie ich es neuerdings nenne: GNU plus Linux.', 'dim'); return;
      case 'windows': out('Fenster? Die sind zum Lüften da.', 'dim'); return;
      case 'rtfm': out('Welches Manual? Es gibt keins. Lies den Quellcode.', 'dim'); return;
      case 'make': out('make: *** Kein Ziel angegeben und keine „Makefile“ gefunden. Schluss.', 'err'); return;
      case 'yes': for (let i = 0; i < 8; i++) out('y'); out('^C', 'dim'); return;
      case 'bash': case 'zsh': case 'fish': case 'sh': out('Du bist bereits in einer Shell. In einer Shell. Shellception.', 'dim'); return;
      case 'python': case 'python3': case 'node': out('>>> print("Hallo")', 'dim'); out('Hallo'); out('>>> exit()', 'dim'); return;
      case 'kill': case 'killall': out('Tux lässt sich nicht beenden. Tux ist ewig.', 'warn'); return;
      default:
        if (PM.includes(c)) return pkgmgr(c, a);
        out(`${cmd}: Befehl nicht gefunden.` + (Math.random() < 0.5 ? ' Meintest du „' + U.pick(['sl', 'fortune', 'cowsay', 'neofetch', 'help']) + '“?' : ''), 'err');
    }
  }

  function secret(id) {
    const fresh = G().secret(id);
    return fresh;
  }

  function cat(f) {
    const d = G().distro();
    switch (f) {
      case 'todo.txt':
        ['TODO:', ' [x] Distro wechseln', ' [x] Distro wechseln', ' [ ] Dotfiles committen', ' [ ] Vim beenden', ' [ ] Das Jahr des Linux-Desktops herbeiführen', ' [x] Distro wechseln'].forEach((l) => out(l)); return;
      case 'README.md': out('# DistroHopper', 'kw'); out('Ein Idle-Game. Klicke, kaufe, hoppe. Bart wachsen lassen.'); out('Lizenz: GPL (Gute-Pinguin-Lizenz)', 'dim'); return;
      case 'witze.txt': out(DH.util.pick(DH.content.fortunes)); return;
      case '.bashrc': out("alias ls='sl'  # hehe", 'dim'); out("alias please='sudo'"); out("export EDITOR=vim  # Hilfe"); return;
      case '/etc/os-release': out('NAME="' + d.name + '"'); out('PRETTY_NAME="' + d.name + ' (' + d.tag + ')"'); out('HOME_URL="https://distrowatch.com"'); return;
      case '/etc/shadow': out('cat: /etc/shadow: Keine Berechtigung. Netter Versuch.', 'err'); return;
      case '/proc/cpuinfo': out('model name : Tux Quantum 9000 @ 4.20GHz'); out('flags      : fpu vme sse2 avx512 kaffee mate'); return;
      case '': out('cat: Warte auf Eingabe … Miau?', 'dim'); return;
      default: out('cat: ' + f + ': Datei oder Verzeichnis nicht gefunden', 'err');
    }
  }

  function sudo(a) {
    const d = G().distro();
    if (a === '!!') { const last = SH.history[SH.history.length - 2]; if (last) { out('sudo ' + last, 'dim'); return exec('sudo ' + last); } return; }
    if (!a) { out('usage: sudo -h | -K | -k | -V', 'dim'); return; }
    const [c, ...r] = a.split(/\s+/);
    if (PM.includes(c)) return pkgmgr(c, r.join(' '), true);
    if (c === 'su' || c === '-i' || c === '-s') { out('Root-Shell verweigert. Tux passt auf.', 'err'); return; }
    out('[sudo] Passwort für ' + d.user + ': ********', 'dim');
    setTimeout(() => {
      out(d.user + ' ist nicht in der sudoers-Datei. Dieser Vorfall wird gemeldet.', 'err');
      secret('sudo');
    }, 700);
  }

  function pkgmgr(c, a) {
    const d = G().distro();
    const own = d.pm.split(' ').filter((x) => x !== 'sudo')[0];
    const same = c === own || (own === 'apt' && c === 'apt-get') || (own === 'dnf' && c === 'yum') || (own === 'pacman' && ['yay', 'paru'].includes(c)) || (own === 'nix-env' && c === 'nix');
    if (c === 'snap') { out('snap wird gestartet … bitte warten … bitte warten … bitte warten …', 'dim'); setTimeout(() => out('Fertig. (Hat nur 47 Sekunden gedauert.)', 'ok'), 1200); return; }
    if (c === 'flatpak') { out('Flatpak: 2,3 GB Laufzeitumgebungen werden heruntergeladen, um einen Taschenrechner zu installieren …', 'dim'); return; }
    if (!same) {
      out(`${c}: Befehl nicht gefunden.`, 'err');
      out(`Falsche Distro, Kollege. Du nutzt ${d.name}. Hier heißt das „${d.pm}“.`, 'warn');
      secret('wrongpm');
      return;
    }
    if (/-syu|upgrade|update|-u\b|--sync/.test(a.toLowerCase())) {
      out(':: Paketdatenbanken werden synchronisiert …', 'dim');
      setTimeout(() => out('Das System ist auf dem neuesten Stand. Glückwunsch, das passiert selten.', 'ok'), 600);
      return;
    }
    if (!a) { out('Was soll ich denn installieren? Gebäude gibt’s im Tab „Pakete“.', 'dim'); return; }
    out(`Fehler: Ziel nicht gefunden: ${a.split(' ').pop()}`, 'err');
    out('Tipp: Gebäude und Upgrades installierst du im Tab „Pakete“.', 'dim');
  }

  function hannah() {
    const S = G().S;
    out('Paketlisten werden gelesen … Fertig', 'dim');
    out('Die folgenden NEUEN Pakete werden installiert: hannah-montana-linux', '');
    setTimeout(() => {
      out('✨ Best of both worlds! ✨', 'ok');
      if (!S.unlocked.hannah) {
        S.unlocked.hannah = true;
        out('Neue Distro im GRUB-Menü freigeschaltet: Hannah Montana Linux', 'warn');
        DH.audio.fanfare();
        DH.bus.emit('distroUnlocked', 'hannah');
      } else out('Ist schon installiert. Du bist ein echter Fan.', 'dim');
      secret('hannah');
    }, 800);
  }

  function sl() {
    DH.ui.train();
    secret('sl');
  }

  function cowsay(text) {
    text = text.slice(0, 60);
    const line = '-'.repeat(text.length + 2);
    [' ' + '_'.repeat(text.length + 2), '< ' + text + ' >', ' ' + line, '        \\   ^__^', '         \\  (oo)\\_______', '            (__)\\       )\\/\\', '                ||----w |', '                ||     ||']
      .forEach((l) => out(l, 'kw'));
    secret('cowsay');
  }

  function lolcat(text) {
    const cols = ['#ff5f6d', '#ffa94d', '#ffd166', '#5ee08f', '#5ce1e6', '#7aa2f7', '#c792ea'];
    const h = [...text].map((ch, i) => `<span style="color:${cols[i % cols.length]}">${DH.util.esc(ch)}</span>`).join('');
    outH(h);
  }

  function cal() {
    const now = new Date();
    const y = now.getFullYear(), m = now.getMonth();
    const title = now.toLocaleString('de-DE', { month: 'long', year: 'numeric' });
    out('   ' + title, 'ok');
    out('Mo Di Mi Do Fr Sa So', 'dim');
    const first = (new Date(y, m, 1).getDay() + 6) % 7;
    const days = new Date(y, m + 1, 0).getDate();
    let row = '   '.repeat(first);
    for (let dd = 1; dd <= days; dd++) {
      row += String(dd).padStart(2) + ' ';
      if ((first + dd) % 7 === 0) { out(row); row = ''; }
    }
    if (row) out(row);
  }

  function ping(host) {
    out(`PING ${host} 56(84) Bytes an Daten.`);
    let i = 0;
    const iv = setInterval(() => {
      i++;
      const t = host.includes('localhost') || host.startsWith('127.') ? (Math.random() * 0.05).toFixed(3) : (10 + Math.random() * 40).toFixed(1);
      out(`64 Bytes von ${host}: icmp_seq=${i} ttl=64 Zeit=${t} ms`);
      if (i >= 4) {
        clearInterval(iv);
        out(`--- ${host} Ping-Statistiken --- 4 Pakete übertragen, 4 empfangen, 0% Paketverlust`, 'dim');
      }
    }, 350);
  }

  function top() {
    const g = G(), S = g.S, U = DH.util;
    out('  PID  NAME                      ANZ   B/s            ANTEIL', 'ok');
    const rows = DH.data.buildings.filter((b) => S.b[b.id] > 0).map((b) => ({ b, v: g.perUnit[b.id] * S.b[b.id] * g.prodMult * g.prodBuff }))
      .sort((x, y) => y.v - x.v).slice(0, 10);
    if (!rows.length) { out('  (noch keine Prozesse – kauf erst mal ein Bash-Skript)', 'dim'); return; }
    rows.forEach((r, i) => out(`${String(1000 + r.b.idx * 37).padStart(5)}  ${r.b.name.padEnd(24).slice(0, 24)} ${String(S.b[r.b.id]).padStart(5)}  ${U.rate(r.v).padEnd(14)} ${U.pct(r.v / Math.max(1e-9, g.bps), 1)}`));
  }

  function systemctl() {
    const S = G().S;
    DH.data.buildings.filter((b) => S.b[b.id] > 0).slice(0, 8).forEach((b) => {
      outH(`<span class="t-ok">●</span> ${DH.content.pkg[b.id]}.service – ${DH.util.esc(b.name)} <span class="t-ok">active (running)</span>`);
    });
    outH('<span class="t-err">●</span> work-life-balance.service – <span class="t-err">failed</span>');
  }

  function git(a) {
    const l = a.toLowerCase();
    if (l.startsWith('blame')) { out('^a1b2c3d (Kevin 2019-04-01) // TODO: fixen', 'warn'); out('Es war Kevin. Es ist immer Kevin.', 'dim'); return; }
    if (l.startsWith('status')) { out('Auf Branch main'); out('Änderungen, die nicht zum Commit vorgemerkt sind:', 'warn'); out('	geändert:       leben.txt', 'err'); return; }
    if (l.startsWith('commit')) { out('[main 1337c0d] ' + (a.match(/-m\s+["']?([^"']+)/) || [0, 'fix'])[1]); out(' 1 file changed, 1 insertion(+), 1337 deletions(-)', 'dim'); return; }
    if (l.startsWith('log')) { ['a1b2c3d fix', 'e4f5a6b fix 2', 'c7d8e9f wirklich finaler fix', '0a1b2c3 bitte funktionier'].forEach((x) => out(x, 'kw')); return; }
    if (l.startsWith('push')) { out('Alles aktuell. Oder alles kaputt. Schwer zu sagen.', 'dim'); return; }
    out('git: „' + a + '“ ist kein git-Befehl. Siehe „git --help“. Oder weine leise.', 'err');
  }

  function hack() {
    const lines = [
      ['Initialisiere Hollywood-Hacker-Modus …', 'dim'], ['Umgehe Firewall … [OK]', 'ok'], ['Verbinde mit dem Mainframe (192.168.0.256) …', ''],
      ['Entschlüssele 128-Bit … 256-Bit … 4096-Bit … [OK]', 'ok'], ['Zweite Person tippt jetzt mit auf der Tastatur …', 'warn'],
      ['Lade GUI-Oberfläche in Visual Basic, um die IP-Adresse zu verfolgen …', ''], ['ENHANCE! … ENHANCE! …', 'warn'], ['ICH BIN DRIN.', 'ok'],
    ];
    lines.forEach(([l, c], i) => setTimeout(() => out(l, c), i * 320));
    setTimeout(() => { DH.fx.matrix(3); secret('hack'); }, lines.length * 320);
  }

  function reboot() {
    out('Das System wird JETZT neu gestartet!', 'warn');
    const crt = document.getElementById('crt');
    crt.classList.add('crt-off');
    setTimeout(() => {
      crt.classList.remove('crt-off');
      T().clear();
      out('[  OK  ] Hast du es schon mit Aus- und Einschalten versucht? Hat funktioniert.', 'ok');
      secret('reboot');
    }, 1400);
  }

  function nuke() {
    const dirs = ['/bin', '/boot', '/etc', '/home/' + G().distro().user + '/memes', '/lib', '/opt', '/usr', '/var', '/home/' + G().distro().user + '/.dotfiles'];
    out('[sudo] Passwort: ********', 'dim');
    dirs.forEach((dd, i) => setTimeout(() => out('entferne ' + dd + ' …', 'err'), 300 + i * 220));
    setTimeout(() => {
      out('Kernel panic - not syncing: Es ist nichts mehr da.', 'err');
      document.getElementById('crt').classList.add('crt-off');
      DH.audio.error();
    }, 300 + dirs.length * 220);
    setTimeout(() => {
      document.getElementById('crt').classList.remove('crt-off');
      T().clear();
      out('…nur ein Scherz. Alles ist noch da. Diesmal.', 'ok');
      secret('rmrf2');
    }, 2200 + dirs.length * 220);
  }

  /* ---- Vim-Falle ---- */
  function vimStart() {
    SH.mode = 'vim';
    SH.vimFails = 0;
    T().clear();
    for (let i = 0; i < 6; i++) out('~', 'dim');
    out('VIM - Vi IMproved · Version 9.1 · „Viel Glück beim Beenden“', 'kw');
    out('-- NORMAL --', 'warn');
    DH.ui.updatePrompt();
  }
  function vim(input) {
    T().println(':' + input, 'dim');
    const q = input.replace(/^:/, '').trim();
    if (['q', 'q!', 'wq', 'x', 'qa', 'qa!', 'wq!', 'zz', 'ZZ'].includes(q) || input === 'ZZ') {
      SH.mode = 'sh';
      T().clear();
      out('Vim wurde beendet. Du gehörst jetzt zu einer sehr kleinen Elite.', 'ok');
      secret('vimexit');
      DH.ui.updatePrompt();
      return;
    }
    SH.vimFails++;
    const msgs = ['E37: Kein Schreibvorgang seit der letzten Änderung (füge ! hinzu zum Erzwingen)', 'E492: Kein Editor-Befehl: ' + q, 'E488: Überschüssige Zeichen', 'Tipp mal „:q!“. Oder zieh den Stecker.'];
    out(SH.vimFails >= 3 ? msgs[3] : msgs[(Math.random() * 3) | 0], SH.vimFails >= 3 ? 'warn' : 'err');
    if (/exit|quit|hilfe|help|raus/.test(q)) out('Nett gefragt. Hilft aber nicht.', 'dim');
  }
})();

/* ---- js/events.js ---- */
'use strict';
/* DistroHopper – Zufallsereignisse: Enten, Bugs, IRC, btw, Zwangsupdates */
(function () {
  const E = DH.events = {};
  const U = DH.util;
  let layer;
  const actors = [];
  const timers = { duck: 75, bug: 35, irc: 150, btw: 30, upd: 120, tux: 40 };
  let ircPending = null; // {left}
  let recentIrc = [], recentQuiz = [];

  E.init = () => {
    layer = document.getElementById('actors');
    const S = DH.game.S;
    // Neulinge: erste Ente etwas früher
    if (S.stats.ducks === 0) timers.duck = 55;
    if (S.stats.irc === 0) timers.irc = 110;
  };

  E.tick = (dt) => {
    const G = DH.game, S = G.S;
    if (DH.ui.blocking()) return; // während Overlays nichts spawnen
    dt = Math.min(dt, 1);
    const d = G.distro();
    timers.duck -= dt * G.duckFreq;
    if (timers.duck <= 0) { timers.duck = U.rand(90, 230); spawnDuck(); }
    if (S.b.bash + S.b.cron > 0 || S.runBytes > 50) {
      timers.bug -= dt * G.bugFreq;
      if (timers.bug <= 0) { timers.bug = U.rand(40, 95); spawnBug(); }
    }
    if (!ircPending) {
      timers.irc -= dt * G.ircFreq;
      if (timers.irc <= 0) { timers.irc = U.rand(170, 340); spawnIrc(); }
    } else {
      ircPending.left -= dt;
      DH.ui.setIrcTime(ircPending.left);
      if (ircPending.left <= 0) { ircPending = null; DH.ui.hideIrc(); }
    }
    if (d.special === 'btw') {
      timers.btw -= dt;
      if (timers.btw <= 0) { timers.btw = U.rand(35, 75); spawnBtw(); }
    }
    if (d.special === 'updates') {
      timers.upd -= dt;
      if (timers.upd <= 0) { timers.upd = U.rand(150, 280); DH.ui.windowsUpdate(); }
    }
    for (let i = actors.length - 1; i >= 0; i--) {
      const a = actors[i];
      a.t += dt;
      if (a.t >= a.life) { a.escape && a.escape(); a.el.remove(); actors.splice(i, 1); continue; }
      a.update(a);
    }
  };

  function vw() { return window.innerWidth; }
  function vh() { return window.innerHeight; }

  /* ------------------------------------------------------------ Ente */
  function spawnDuck(forced) {
    const G = DH.game;
    const el = U.h('button', { class: 'actor duck', type: 'button', 'aria-label': 'Goldene Gummiente – anklicken!' }, U.h('img', { src: DH.sprites.url('duck'), alt: '' }));
    layer.appendChild(el);
    const fromLeft = Math.random() < 0.5;
    const y0 = vh() * U.rand(0.18, 0.6);
    const life = 13 * G.duckLife;
    const a = {
      el, t: 0, life,
      update(a) {
        const k = a.t / a.life;
        const x = fromLeft ? U.lerp(-70, vw() + 10, k) : U.lerp(vw() + 10, -70, k);
        const y = y0 + Math.sin(a.t * 2.4) * 18;
        const r = Math.sin(a.t * 3) * 8;
        const fade = a.t < 0.4 ? a.t / 0.4 : a.t > a.life - 1 ? (a.life - a.t) : 1;
        el.style.transform = `translate(${x}px, ${y}px) rotate(${r}deg) scaleX(${fromLeft ? 1 : -1})`;
        el.style.opacity = fade;
        if (Math.random() < 0.06) DH.fx.sparks(x + 30, y + 30, 1, '#fff4b0');
      },
    };
    el.addEventListener('pointerdown', (ev) => {
      ev.preventDefault(); ev.stopPropagation();
      catchDuck(ev.clientX, ev.clientY);
      el.remove();
      const i = actors.indexOf(a); if (i >= 0) actors.splice(i, 1);
    });
    actors.push(a);
    a.update(a);
    const S = G.S;
    if (!S.tut.duck) {
      S.tut.duck = 1;
      DH.ui.tuxSay('Eine goldene Gummiente! Schnell draufklicken – sie bringt Boni!', 6000);
    } else if (Math.random() < 0.3 && !forced) DH.ui.tuxSay(U.pick(['Da! Eine goldene Ente!', 'Quack? QUACK! Schnell klicken!', 'Ente in Sicht!']), 3000);
  }
  E.spawnDuck = spawnDuck;

  function catchDuck(x, y) {
    const G = DH.game, S = G.S;
    S.stats.ducks++;
    DH.audio.quack();
    DH.ui.vibrate([20, 40, 20]);
    let fx = U.weighted(DH.content.duckFx);
    const res = G.duckEffect(fx.id) || {};
    if (res.fallback) fx = DH.content.duckFx.find((x) => x.id === res.fallback) || fx;
    DH.fx.sparks(x, y, 26, '#ffd23f');
    DH.fx.confetti(24, x, y);
    let title = fx.name, text = fx.text;
    if (fx.id === 'lucky') { text = '+' + U.bytes(res.amount) + ' – ' + fx.text; DH.fx.text(x, y - 20, '+' + U.bytes(res.amount), '#ffd23f', 34, { big: true, max: 1.6 }); }
    else if (fx.id === 'special' && res.building) { text = res.building.name + ': Produktion ×' + U.num(res.mult, 1) + '!'; DH.fx.text(x, y - 20, title, '#ffd23f', 28, { big: true, max: 1.6 }); }
    else DH.fx.text(x, y - 20, title + '!', '#ffd23f', 28, { big: true, max: 1.6 });
    DH.ui.toast({ icon: DH.sprites.url('duck'), title: 'Quack! ' + title, text, kind: 'gold' });
    DH.term.println('[quack] ' + title + ' – ' + text, 'warn');
    G.checkAchievements();
  }

  /* ------------------------------------------------------------ Bug */
  function spawnBug() {
    const crt = document.getElementById('crt');
    if (!crt) return;
    const r = crt.getBoundingClientRect();
    if (r.width < 80 || r.height < 60 || r.bottom < 0 || r.top > vh()) return;
    const el = U.h('button', { class: 'actor bug', type: 'button', 'aria-label': 'Bug – zerquetschen!' }, U.h('img', { src: DH.sprites.url('bugA'), alt: '' }));
    layer.appendChild(el);
    const edge = U.randInt(0, 3);
    const pad = 20;
    const pts = [
      [U.rand(r.left + pad, r.right - pad), r.top - 10],
      [r.right + 10, U.rand(r.top + pad, r.bottom - pad)],
      [U.rand(r.left + pad, r.right - pad), r.bottom + 10],
      [r.left - 10, U.rand(r.top + pad, r.bottom - pad)],
    ];
    const [x0, y0] = pts[edge];
    const [x1, y1] = pts[(edge + 2) % 4];
    const dist = Math.hypot(x1 - x0, y1 - y0);
    const life = Math.max(5, dist / 55);
    const ang = Math.atan2(y1 - y0, x1 - x0) * 180 / Math.PI + 90;
    const imgA = DH.sprites.url('bugA'), imgB = DH.sprites.url('bugB');
    const img = el.firstChild;
    let frame = 0;
    const a = {
      el, t: 0, life,
      update(a) {
        const k = a.t / a.life;
        const wig = Math.sin(a.t * 9) * 5;
        const x = U.lerp(x0, x1, k) - 24 + Math.cos(ang * Math.PI / 180) * wig;
        const y = U.lerp(y0, y1, k) - 24 + Math.sin(ang * Math.PI / 180) * wig;
        el.style.transform = `translate(${x}px, ${y}px) rotate(${ang + Math.sin(a.t * 9) * 8}deg)`;
        const f = Math.floor(a.t * 8) % 2;
        if (f !== frame) { frame = f; img.src = f ? imgB : imgA; }
      },
      escape() { DH.term.println('[ WARN ] Ein Bug ist nach Produktion entkommen. Er wird sich wohlfühlen.', 'warn'); },
    };
    el.addEventListener('pointerdown', (ev) => {
      ev.preventDefault(); ev.stopPropagation();
      squash(ev.clientX, ev.clientY);
      el.remove();
      const i = actors.indexOf(a); if (i >= 0) actors.splice(i, 1);
    });
    actors.push(a);
    a.update(a);
    if (!DH.game.S.tut.bug) { DH.game.S.tut.bug = 1; DH.ui.tuxSay('Ein Bug krabbelt übers Terminal! Zerquetsch ihn, das gibt Bytes!', 5500); }
  }
  E.spawnBug = spawnBug;

  function squash(x, y) {
    const G = DH.game, S = G.S;
    S.stats.bugs++;
    const v = G.bugReward();
    G.earn(v);
    DH.audio.squash();
    DH.fx.sparks(x, y, 16, '#7ee787');
    DH.fx.text(x, y - 10, 'Bug gefixt! +' + U.bytes(v), '#7ee787', 24, { max: 1.3 });
    const splat = U.h('div', { class: 'splat', style: { left: (x - 20) + 'px', top: (y - 20) + 'px' } });
    layer.appendChild(splat);
    setTimeout(() => splat.remove(), 900);
    if (DH.ui.vibrate) DH.ui.vibrate(18);
    G.checkAchievements();
  }

  /* ------------------------------------------------------------ IRC */
  function spawnIrc() {
    ircPending = { left: 60 };
    DH.ui.showIrc();
    DH.audio.ping();
    if (!DH.game.S.tut.irc) { DH.game.S.tut.irc = 1; DH.ui.tuxSay('Pling! Oben in der Leiste wartet eine IRC-Nachricht. Antworte, bevor sie verschwindet!', 6500); }
  }
  E.spawnIrc = spawnIrc;
  E.openIrc = () => {
    if (!ircPending) return;
    ircPending = null;
    DH.ui.hideIrc();
    const G = DH.game, S = G.S;
    const quiz = Math.random() < 0.45;
    if (quiz) {
      const pool = DH.content.quiz.map((q, i) => i).filter((i) => !recentQuiz.includes(i));
      const i = U.pick(pool);
      recentQuiz.push(i); if (recentQuiz.length > 25) recentQuiz.shift();
      DH.ui.quizDialog(DH.content.quiz[i]);
    } else {
      const pool = DH.content.irc.map((q, i) => i).filter((i) => !recentIrc.includes(i));
      const i = U.pick(pool);
      recentIrc.push(i); if (recentIrc.length > 14) recentIrc.shift();
      DH.ui.ircDialog(DH.content.irc[i]);
    }
  };
  E.hasIrc = () => !!ircPending;

  // Auswirkungen einer IRC-Entscheidung anwenden → Ergebnistext
  E.applyEffect = (eff) => {
    const G = DH.game, U2 = DH.util;
    if (!eff || eff.none) return '';
    if (eff.lump) {
      const v = G.lump(eff.lump) * G.ircMult;
      G.earn(v);
      return '+' + U2.bytes(v);
    }
    if (eff.buff) {
      const b = eff.buff;
      G.addBuff({ id: 'irc_' + b.name, name: b.name, kind: b.kind, mult: b.mult, dur: b.dur, icon: b.mult >= 1 ? 'chat' : 'skull' });
      return (b.kind === 'click' ? 'Klickkraft ' : 'Produktion ') + '×' + U2.trimDec(b.mult, 2) + ' für ' + U2.dur(b.mult >= 1 ? b.dur * G.buffDur : b.dur);
    }
    return '';
  };

  /* ------------------------------------------------------------ btw */
  function spawnBtw() {
    const term = document.getElementById('w-term');
    const r = term.getBoundingClientRect();
    if (r.width < 100) return;
    const el = U.h('button', { class: 'actor btw', type: 'button' }, 'btw, ich nutze Arch');
    layer.appendChild(el);
    const x = U.rand(r.left + 20, Math.max(r.left + 30, r.right - 190));
    const y = U.rand(r.top + 70, Math.max(r.top + 80, r.bottom - 120));
    const a = {
      el, t: 0, life: 8,
      update(a) {
        const s = a.t < 0.25 ? a.t / 0.25 : a.t > a.life - 0.5 ? (a.life - a.t) * 2 : 1;
        el.style.transform = `translate(${x}px, ${y + Math.sin(a.t * 3) * 4}px) scale(${0.6 + 0.4 * s})`;
        el.style.opacity = s;
      },
    };
    el.addEventListener('pointerdown', (ev) => {
      ev.preventDefault(); ev.stopPropagation();
      const G = DH.game;
      G.S.stats.btw++;
      G.addBuff({ id: 'btw', name: 'Allen von Arch erzählt', kind: 'prod', mult: 1.77, dur: 30, icon: 'd_arch' });
      DH.audio.coin();
      DH.fx.text(ev.clientX, ev.clientY - 10, 'Alle wissen es jetzt! +77 %', '#5ce1e6', 24);
      el.remove();
      const i = actors.indexOf(a); if (i >= 0) actors.splice(i, 1);
      G.checkAchievements();
    });
    actors.push(a);
    a.update(a);
  }

  E.spawnBtw = spawnBtw;
  E.clearActors = () => { actors.forEach((a) => a.el.remove()); actors.length = 0; ircPending = null; DH.ui.hideIrc(); };
})();

/* ---- js/ui.js ---- */
'use strict';
/* DistroHopper – Oberfläche: HUD, Shop, Panels, Tooltips, Tux, Ticker */
(function () {
  const UI = DH.ui = {};
  const U = DH.util, SP = DH.sprites, D = DH.data;
  const G = () => DH.game;
  const E = {};
  let qty = '1';
  let upgKey = null;
  const bldRows = {};
  let blocking = 0;
  let tipState = null; // {kind, id, el, pinned}
  let unseenAch = 0;
  let lastClickAt = Date.now();
  let idleSaid = false;
  const wideMQ = window.matchMedia('(min-width: 1180px)');
  const narrowMQ = window.matchMedia('(max-width: 759.98px)');
  const hoverMQ = window.matchMedia('(hover: hover) and (pointer: fine)');

  UI.blocking = () => blocking > 0;
  UI.block = (on) => { blocking = Math.max(0, blocking + (on ? 1 : -1)); };
  UI.isWide = () => wideMQ.matches;
  UI.isNarrow = () => narrowMQ.matches;
  const canHover = () => hoverMQ.matches;

  /* ================================================================= Init */
  UI.init = () => {
    const ids = ['app', 'bar-bytes', 'bar-rate', 'bar-buffs', 'bar-distro', 'bar-distro-ico', 'brand-tux', 'irc-btn', 'irc-ico', 'irc-time', 'mute-btn', 'mute-ico', 'clock',
      'tk-text', 'ticker', 'term-title', 'shell-btn', 'term-collapse', 'cnt-bytes', 'cnt-rate', 'cnt-click', 'cnt-raw', 'term-buffs', 'crt', 'crt-hint', 'shell-form', 'shell-in', 'ps1',
      'tux', 'bubble', 'distro-chip', 'beard-chip', 'kbd', 'tabs', 'w-center', 'p-setup', 'p-ach', 'p-hop', 'p-sys', 'w-shop', 'shop-title', 'buy-qty', 'upg-grid', 'upg-count',
      'buy-all', 'autobuy-wrap', 'autobuy-upg', 'autobld-wrap', 'autobuy-bld', 'bld-list', 'bld-count', 'tip', 'toasts', 'wall-logo', 'badge-shop', 'badge-ach', 'badge-hop'];
    ids.forEach((id) => { E[id.replace(/-(\w)/g, (m, c) => c.toUpperCase())] = document.getElementById(id); });

    const S = G().S;
    qty = S.settings.qty || '1';
    U.settings.notation = S.settings.notation;

    E.brandTux.src = SP.url('tux');
    E.ircIco.src = SP.url('chat');
    // Tab-Icons
    const tabIcons = { shop: 'box', setup: 'monitor', ach: 'trophy', hop: 'disc', sys: 'gear' };
    E.tabs.querySelectorAll('.tab').forEach((b) => { b.querySelector('img').src = SP.url(tabIcons[b.dataset.tab]); });

    buildKeyboard();
    buildBuildings();
    bindEvents();
    UI.applyTheme();
    applySettings();
    UI.setTab(S.settings.tab || (UI.isNarrow() ? 'shop' : 'setup'), true);
    UI.renderPanels();
    tickerNext();
    if (S.stats.clicks > 0) E.crtHint.hidden = true;
  };

  /* ================================================================= Theme */
  function hexToRgb(hex) { const n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  function rgba(hex, a) { const [r, g, b] = hexToRgb(hex); return `rgba(${r},${g},${b},${a})`; }
  function lum(hex) { const [r, g, b] = hexToRgb(hex).map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * r + 0.7152 * g + 0.0722 * b; }
  function mix(a, b, t) { const A = hexToRgb(a), B = hexToRgb(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }

  UI.applyTheme = () => {
    const S = G().S, d = G().distro();
    const st = document.documentElement.style;
    st.setProperty('--accent', d.color);
    st.setProperty('--accent-2', SP.shade(d.color, 0.35));
    st.setProperty('--accent-ink', lum(d.color) > 0.36 ? '#0d1016' : '#ffffff');
    st.setProperty('--accent-soft', rgba(d.color, 0.16));
    st.setProperty('--wall1', d.color);
    st.setProperty('--wall2', d.color2);
    document.body.classList.toggle('pink', d.id === 'hannah');
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', mix(d.color2, '#07090d', 0.7));
    applyScheme();
    // Wallpaper-Logo
    const wl = E.wallLogo.getContext('2d');
    wl.clearRect(0, 0, 32, 32);
    wl.imageSmoothingEnabled = false;
    const logo = SP.canvas('d_' + d.id);
    if (logo) wl.drawImage(logo, 0, 0, 32, 32);
    E.barDistro.textContent = d.short || d.name;
    E.barDistroIco.src = SP.url('d_' + d.id);
    E.termTitle.textContent = d.user + '@' + d.id + ': ~';
    const pmName = d.pm.split(' ').filter((x) => x !== 'sudo')[0];
    E.shopTitle.textContent = '~/pakete — ' + pmName;
    UI.updatePrompt();
    updateChips();
    drawTux(true);
    DH.audio.musicSong(d.id);
  };

  function applyScheme() {
    const S = G().S, d = G().distro();
    const st = document.documentElement.style;
    let sc = D.schemes.find((x) => x.id === S.settings.scheme);
    if (!sc || !schemeUnlocked(sc)) sc = D.schemes[0];
    let c = sc.c;
    if (!c) {
      c = {
        bg: mix(d.color2, '#030405', 0.86), fg: mix(d.color, '#ffffff', 0.82), dim: mix(d.color, '#7a8390', 0.55),
        prompt: SP.shade(d.color, 0.3), ok: '#7ee787', err: '#ff7b72', warn: '#e3b341', str: mix(d.color, '#ffffff', 0.55), glow: rgba(d.color, 0.32),
      };
    }
    st.setProperty('--t-bg', c.bg); st.setProperty('--t-fg', c.fg); st.setProperty('--t-dim', c.dim); st.setProperty('--t-prompt', c.prompt);
    st.setProperty('--t-ok', c.ok); st.setProperty('--t-err', c.err); st.setProperty('--t-warn', c.warn); st.setProperty('--t-str', c.str); st.setProperty('--t-glow', c.glow);
  }
  UI.applyScheme = applyScheme;

  function unlockOk(un) {
    if (!un) return true;
    const S = G().S, g = G();
    if (un.hops != null && S.hops < un.hops) return false;
    if (un.bytes != null && S.allBytes < un.bytes) return false;
    if (un.ach != null && g.nAch < un.ach) return false;
    if (un.visited != null && g.visitedCount() < un.visited) return false;
    if (un.upgrades != null && S.stats.upgradesBought < un.upgrades) return false;
    if (un.beard != null && S.beard < un.beard) return false;
    if (un.secret && !S.secrets[un.secret]) return false;
    if (un.visitedId && !S.visited[un.visitedId]) return false;
    if (un.clicks != null && S.stats.clicks < un.clicks) return false;
    if (un.upgrade && !S.u[un.upgrade] && !S.stats['had_' + un.upgrade]) return false;
    return true;
  }
  function unlockText(un) {
    if (!un) return '';
    if (un.hops != null) return un.hops + ' Hop' + (un.hops > 1 ? 's' : '');
    if (un.bytes != null) return U.bytes(un.bytes) + ' insgesamt';
    if (un.ach != null) return un.ach + ' Erfolge';
    if (un.visited != null) return un.visited + ' Distros besucht';
    if (un.upgrades != null) return un.upgrades + ' Upgrades gekauft';
    if (un.beard != null) return un.beard + ' Barthaare';
    if (un.secret) return 'Geheimnis';
    if (un.visitedId) return 'Geheime Distro';
    if (un.clicks != null) return U.num(un.clicks) + ' Klicks';
    if (un.upgrade) return 'Upgrade „' + (D.uIndex[un.upgrade] || {}).name + '“';
    return '';
  }
  const schemeUnlocked = (sc) => unlockOk(sc.unl);
  UI.soundUnlocked = (s) => unlockOk(s.unl);

  /* ================================================================= Tastatur */
  const KB = [
    ['^', '1', '2', '3', '4', '5', '6', '7', '8', '9', '0', 'ß', '⌫:w15'],
    ['⇥:w15', 'Q', 'W', 'E', 'R', 'T', 'Z', 'U', 'I', 'O', 'P', 'Ü'],
    ['⇪:w15', 'A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L', 'Ö', 'Ä', '↵:w15'],
    ['⇧:w2', 'Y', 'X', 'C', 'V', 'B', 'N', 'M', ',', '.', '-', '⇧:w15'],
    ['Strg:w15', '❖', 'Alt', '␣:w6', 'AltGr', 'Strg:w15'],
  ];
  const keyMap = {};
  const allKeys = [];
  function buildKeyboard() {
    E.kbd.innerHTML = '';
    KB.forEach((row, ri) => {
      const r = U.h('div', { class: 'kbd-row' + (ri === 0 ? ' num' : '') });
      row.forEach((k) => {
        const [lab, w] = k.split(':');
        const el = U.h('span', { class: 'key' + (w ? ' ' + w : '') }, lab === '␣' ? '' : lab);
        r.appendChild(el);
        if (!keyMap[lab]) keyMap[lab] = el;
        allKeys.push(el);
      });
      E.kbd.appendChild(r);
    });
  }
  const specialKeys = { ' ': '␣', Backspace: '⌫', Enter: '↵', Tab: '⇥', Shift: '⇧', CapsLock: '⇪', Control: 'Strg', Alt: 'Alt', AltGraph: 'AltGr', Meta: '❖', Dead: '^' };
  function flashKey(el) {
    if (!el) return;
    el.classList.add('on');
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('on'), 90);
  }
  function flashRandomKeys(n = 1) {
    for (let i = 0; i < n; i++) flashKey(allKeys[(Math.random() * allKeys.length) | 0]);
  }

    const submitShell = () => {

      UI.updatePrompt();
    };
    E.shellForm.addEventListener('submit', (e) => { e.preventDefault(); submitShell(); });
    E.shellIn.addEventListener('keydown', (e) => {
      const SH = DH.shell;
      if (e.key === 'Enter') { e.preventDefault(); submitShell(); return; }
      if (e.key === 'Escape') { e.preventDefault(); UI.closeShell(); return; }
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (!SH.history.length) return;
        SH.hIdx = SH.hIdx < 0 ? SH.history.length - 1 : Math.max(0, SH.hIdx - 1);
        E.shellIn.value = SH.history[SH.hIdx];
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (SH.hIdx < 0) return;
        SH.hIdx++;
        if (SH.hIdx >= SH.history.length) { SH.hIdx = -1; E.shellIn.value = ''; } else E.shellIn.value = SH.history[SH.hIdx];
      } else if (e.key === 'Tab') {
        e.preventDefault();
        E.shellIn.value = SH.complete(E.shellIn.value);
      } else if (e.key.length === 1) {
        DH.audio.key();
        const k = keyMap[e.key.toUpperCase()]; flashKey(k);
      }
    });

    // Tooltip schließen bei Tipp daneben (Touch)
    document.addEventListener('pointerdown', (e) => {

    if (t === 'setup' && UI.isWide() && cur === 'shop') return true;

    hideTip();

    if (t === 'hop') { G().S.tut.hopSeen = true; G().S.tut.hopAck = G().S.hops; UI.renderHop(); }
    if (t === 'sys') UI.renderSys();
